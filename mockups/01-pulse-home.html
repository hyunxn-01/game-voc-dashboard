<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>01 펄스 홈 · 로스트아크 VOC 견본</title>
<style>
:root{
  --page:#f5f4ef; --card:#ffffff; --ink:#111110; --ink2:#52514e; --muted:#8a8882; --line:#e3e1d9; --grid:#ecebe5; --axis:#c9c7bd;
  --ai:#3a2f98; --ai-soft:#efedff; --ai-line:#b9b1f3; --ai-hot:#e1dcff;
  --c-inven:#2a78d6; --c-arca:#eb6834; --c-lostark_free:#1baf7a; --c-reddit:#6250d6;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --font:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:0 40px}
.num{font-variant-numeric:tabular-nums}
/* 머리 */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 0;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-size:44px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.brand .sub{color:var(--ink2);font-size:15px}
.seg{display:inline-flex;background:#e9e7df;border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;font:inherit;font-size:14px;padding:6px 16px;border-radius:999px;color:var(--ink2);cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.weekline{margin:10px 0 0;color:var(--ink2);font-size:14px}
.weekline b{color:var(--ink)}
/* AI 문단 */
.pulse{margin:26px 0 0;padding:30px 0 30px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);position:relative}
.ai-tag{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ai);background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:999px;padding:3px 10px;letter-spacing:.01em}
.ai-tag svg{flex:none}
.pulse-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.pulse-head .hint{font-size:13px;color:var(--muted)}
.para{font-size:28px;line-height:1.62;letter-spacing:-.012em;color:var(--ai);margin:0;font-weight:500}
.para .sent{border-radius:6px;padding:1px 3px;margin:0 -3px;cursor:pointer;transition:background .15s;outline:none;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.para .sent.concl{font-weight:750}
.para .sent:hover,.para .sent:focus-visible,.para .sent.on{background:var(--ai-hot)}
.para .who{display:inline-block;vertical-align:.18em;font-size:12.5px;font-weight:700;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:6px;padding:0 7px;margin-right:6px;line-height:22px;letter-spacing:0}
.para .who i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.para sup.ref{font-size:12px;font-weight:800;color:#fff;background:var(--ai);border-radius:999px;padding:1px 6px;margin-left:4px;vertical-align:.6em;letter-spacing:0}
.trustrow{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:13px;color:var(--ink2)}
.trustrow span b{color:var(--ink)}
/* 카드 그리드 */
section.block{margin-top:30px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.block-h h2{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
.block-h .note{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;position:relative;cursor:pointer;transition:box-shadow .2s,border-color .2s,opacity .2s,transform .2s;outline:none;min-width:0}
.card:hover{border-color:#cfccc0}
.card:focus-visible{box-shadow:0 0 0 3px var(--ai-line)}
.card.lit{border-color:var(--ai);box-shadow:0 0 0 3px var(--ai-hot),0 10px 24px -12px rgba(58,47,152,.45);transform:translateY(-2px)}
.card.sel{border-color:var(--ink)}
body.linking .card:not(.lit){opacity:.42}
.card .refno{position:absolute;top:14px;right:14px;font-size:12px;font-weight:800;color:#fff;background:var(--ai);border-radius:999px;min-width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.card .k-label{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);padding-right:30px;min-height:20px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.card .k-issue{font-size:15px;font-weight:700;margin-top:2px;padding-right:20px}
.card .k-big{display:flex;align-items:baseline;gap:10px;margin-top:10px;flex-wrap:wrap}
.card .k-big .v{font-size:40px;line-height:1;font-weight:800;letter-spacing:-.02em}
.card .k-big .cmp{font-size:13.5px;color:var(--ink2)}
.card .k-spark{margin-top:12px;color:var(--muted);position:relative}
.card .k-spark svg{display:block;width:100%;height:42px;overflow:visible}
.card .k-foot{margin-top:10px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.card .k-ai{margin-top:12px;padding-top:11px;border-top:1px dashed var(--ai-line);font-size:13px;color:var(--ai)}
.card .k-ai .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;border:1px solid transparent;white-space:nowrap}
.badge.ai{color:var(--ai);background:var(--ai-soft);border-color:var(--ai-line)}
.badge.lv{background:#fff;border-color:var(--line);color:var(--ink)}
.badge.lv i{width:8px;height:8px;border-radius:2px;display:inline-block}
.badge.calc{color:var(--ink2);background:#f1f0eb;border-color:var(--line)}
.badge.ex{color:#7a4b00;background:#fff3d6;border-color:#f1d08a}
.card .null{font-size:24px;font-weight:700;color:var(--muted)}
/* 상세 */
.detail{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px}
.detail h3{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}
.detail .dsub{font-size:13px;color:var(--ink2);margin-bottom:14px}
.chart{position:relative}
.chart svg{display:block;width:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:6px 0 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:16px;height:2px;border-radius:1px;display:inline-block}
.legend .ln.dash{background:repeating-linear-gradient(90deg,var(--ink2) 0 3px,transparent 3px 6px)!important}
.legend .mk{width:8px;height:8px;border-radius:2px;background:var(--ai);display:inline-block}
.aibox{background:var(--ai-soft);border:1px solid var(--ai-line);border-radius:14px;padding:16px 18px;color:#251d6e}
.aibox .aihead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.aibox p{margin:0 0 10px;font-size:14.5px;line-height:1.65}
.aibox ul{margin:6px 0 0;padding:0;list-style:none}
.aibox li{padding:8px 0;border-top:1px solid var(--ai-line);font-size:13.5px}
.aibox li q{display:block;color:#4a4290;font-style:normal;margin-top:2px}
.aibox li q::before{content:"“"}.aibox li q::after{content:"”"}
.reads{margin-top:14px}
.reads h4,.cmp-tbl h4{margin:0 0 6px;font-size:13px;color:var(--ink2);font-weight:700}
.reads ol{margin:0;padding-left:22px;font-size:13px;color:var(--ink2)}
.reads li{padding:3px 0}
.reads li a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.reads li a:hover{border-color:var(--ink)}
.reads .g{font-size:11.5px;color:var(--muted);margin-left:4px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--grid)}
table.t th{color:var(--muted);font-weight:600;font-size:12px}
table.t td.r,table.t th.r{text-align:right}
.cmp-tbl{margin-top:18px}
.calcnote{font-size:12.5px;color:var(--muted);margin-top:10px}
/* 연결선 */
#links{position:absolute;left:0;top:0;pointer-events:none;z-index:5;overflow:visible}
#links path{fill:none;stroke:var(--ai);stroke-width:1.6;stroke-dasharray:4 4;opacity:.75}
#links circle{fill:var(--ai)}
/* 툴팁 */
#tip{position:fixed;z-index:20;pointer-events:none;background:#111110;color:#fff;font-size:12.5px;line-height:1.45;border-radius:8px;padding:8px 10px;box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;transition:opacity .08s;max-width:260px}
#tip .tw{color:#bdbbb3;font-size:11.5px;margin-bottom:3px}
#tip .tr{display:flex;align-items:center;gap:6px;justify-content:space-between}
#tip .tr i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
#tip .tr b{font-variant-numeric:tabular-nums}
/* 바닥 */
footer.meta{margin:40px 0 0;padding:18px 0 34px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
footer.meta a{color:var(--ink2)}
.state{padding:80px 0;text-align:center;color:var(--ink2);font-size:16px}
.state.err{color:var(--crit)}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{grid-template-columns:1fr}}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .brand h1{font-size:30px}
  .para{font-size:20px;line-height:1.6}
  .grid{grid-template-columns:1fr}
  .detail{padding:16px}
  .card .k-big .v{font-size:34px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>이번 주 펄스</h1><span class="sub">로스트아크 커뮤니티 VOC · 주간</span></div>
    <div class="seg" role="group" aria-label="지역"><button data-region="국내" aria-pressed="true">국내</button><button data-region="해외" aria-pressed="false">해외</button></div>
  </header>
  <p class="weekline" id="weekline">데이터를 읽는 중…</p>
  <main id="app"><div class="state">데이터를 읽는 중입니다…</div></main>
  <footer class="meta" id="meta">
    <span>견본 01 · 펄스 홈 — 견본(목업) — 실제 데이터 사용, 예시 값은 표시함 · 데이터 생성 시각 <span id="gen">–</span></span>
    <a href="./index.html">견본 목록</a>
  </footer>
</div>
<svg id="links" aria-hidden="true"></svg>
<div id="tip" role="tooltip"></div>
<script>
/* ===== VOC KIT (데이터 읽기 공용 코드) — 각 견본 HTML 안에 그대로 복사해 쓴다 ===== */
const K = (() => {
  const ROOT = "..";               // mockups/ 아래에서 저장소 루트
  const j = p => fetch(`${ROOT}/${p}`, {cache: "no-store"}).then(r => { if (!r.ok) throw new Error(p + " HTTP " + r.status); return r.json(); });
  const opt = p => j(p).catch(() => null);

  async function load() {
    const games = await j("games.json");
    const g = games.games.find(x => x.file) || {id: "lostark", file: "data/lostark.json"};
    const [D, daily, monthly] = await Promise.all([j(g.file), opt(`data/${g.id}-daily.json`), opt(`data/${g.id}-monthly.json`)]);
    return {games, game: g, D, daily, monthly};
  }

  // ---------- 주 · 지역 ----------
  const idx = (D, week) => D.weeks.indexOf(week);
  const latestWeek = D => D.weeks[D.weeks.length - 1];
  // AI 결론(conclusion)이 있는 가장 최근 주. 없으면 마지막 주.
  function aiWeek(D, region) {
    const W = D.weekly[region] || {};
    for (let i = D.weeks.length - 1; i >= 0; i--) { const w = W[D.weeks[i]]; if (w && w.conclusion) return D.weeks[i]; }
    return latestWeek(D);
  }
  const weekly = (D, region, week) => (D.weekly[region] || {})[week] || {conclusion: null, insights: [], items: [], responses: []};
  const summary = (D, region, week) => (D.summary[region] || {})[week] || null;
  const communities = (D, region) => D.communities.filter(c => c.enabled && (!region || c.region === region));
  const comName = (D, id) => (D.communities.find(c => c.id === id) || {}).name || id;
  const boardsOf = (D, comId) => D.boards.filter(b => b.community === comId);

  // ---------- 시리즈 (52주 배열, D.weeks와 같은 순서) ----------
  // scope 예: "community:arca", "region:국내", "board:inven:6271"
  // metric 예: "posts", "neg", "topic:operation", "topic_neg:churn", "group:보석", "signal:이탈 표현", "opinion:complaint"
  // field: value(비중 또는 건수) · base(평시=직전 8주 평균) · ratio(value/base) · diff(neg류: value-base) · count · den · z · n_base
  const ser = (D, scope, metric, field = "value") => (((D.series[scope] || {})[metric] || {})[field]) || D.weeks.map(() => null);
  const at = (D, scope, metric, field, week) => ser(D, scope, metric, field)[idx(D, week)];
  const lastN = (arr, i, n = 13) => arr.slice(Math.max(0, i - n + 1), i + 1);
  const weeksN = (D, week, n = 13) => lastN(D.weeks, idx(D, week), n);

  // 글 수 지수(평시=100) — 게시판별 D.ratio[boardKey][i] * 100, 커뮤니티는 series community:<id> posts ratio
  const postsIndex = (D, scope, week) => { const r = at(D, scope, "posts", "ratio", week); return r == null ? null : Math.round(r * 100); };

  // ---------- 분류 블록(감성 · 주제 · 의견) ----------
  // block 키: "community:arca", "region:국내", "board:inven:6271"
  const block = (D, key, week) => (D.classified_blocks[key] || [])[idx(D, week)] || null;
  // 순감성 지수 = (긍정-부정)/(긍정+부정). 데이터의 net 필드가 같은 값. 주제 '기타'는 제외된 상태.
  const net = b => b ? b.net : null;
  const sentShares = b => { if (!b) return null; const o = b.overall, n = o.pos + o.neg + o.neu + o.unk; return n ? {pos: o.pos / n, neg: o.neg / n, neu: o.neu / n, unk: o.unk / n, n} : null; };
  const topicName = (D, id) => (D.topics.find(t => t.id === id) || {}).name || id;
  const opinionName = (D, id) => (D.opinions.find(t => t.id === id) || {}).name || id;
  // 주제별 부정 비율: topic_senti[t].neg / (neg+neu+pos+unk)
  function topicNeg(b) {
    if (!b || !b.topic_senti) return [];
    return Object.entries(b.topic_senti).map(([t, s]) => { const n = s.neg + s.neu + s.pos + s.unk; return {topic: t, n, neg: n ? s.neg / n : null, pos: n ? s.pos / n : null}; });
  }

  // ---------- 이슈 후보 · AI 판단 · 정독 ----------
  const candidates = (D, region, week) => ((D.candidates[region] || {})[week]) || [];
  const deepread = (D, id) => D.deepread[id] || null;     // {model, read:[{title,url,group:"추천 상위"|"무작위",recommends,comments,date}], result:{summary,subissues:[{name,count,quote,quote_post}],causes:[{event,hypothesis}],confidence:"high|medium|low",endorsed_vs_common}}
  const CONF = {high: "높음", medium: "보통", low: "낮음"};
  const rising = (D, region, week) => ((D.rising[region] || {})[week]) || [];   // [{word,count,base,ratio,new,community,reps:[{title,url,...}]}]
  const reps = (D, region, week) => (((D.representatives[region] || {})[week]) || {});   // {metricId: [{community, posts:[...]}], posts:[...]}

  // ---------- 운영 대응 ----------
  // weekly(...).responses: [{date, kind:"문제 안내|소통|제재|변경 예고", reward, title, url}]
  // 대응 전후 비교: 그 주와 다음 주의 커뮤니티 부정 비율
  function beforeAfterNeg(D, comId, week) {
    const i = idx(D, week), s = ser(D, "community:" + comId, "neg");
    return {before: s[i] ?? null, after: i + 1 < s.length ? s[i + 1] ?? null : null, nextWeek: D.weeks[i + 1] || null};
  }
  const updatesIn = (D, week) => D.updates.filter(u => u.week === week && u.server === "kr");
  const eventsIn = (D, week) => D.other_events.filter(u => u.week === week);

  // ---------- 게임 지표 ----------
  const pcbang = (D, week) => (D.game_metrics.pcbang || []).find(p => p.period_start === week) || null; // {rank, share(%), hours, wow(%), url, source}
  const steam = (D, week) => (D.game_metrics.steam || []).find(p => p.week === week) || null;          // {max, avg, granularity}

  // ---------- 만든 방법 ----------
  const chosenCombo = D => D.method.compare.combos.find(c => c.chosen);  // {name, topic:{accuracy,ci95,n}, sentiment:{...}, opinion:{...}, monthly_total_usd:[lo,hi]}
  const spendTotal = D => Object.values(D.method.spend).reduce((a, b) => a + b, 0);

  // ---------- 표시 형식 ----------
  const num = v => v == null ? "–" : Math.round(v).toLocaleString("ko-KR");
  const pct = (v, d = 1) => v == null ? "–" : (v * 100).toFixed(d) + "%";
  const pp = (v, d = 1) => v == null ? "–" : (v >= 0 ? "+" : "") + (v * 100).toFixed(d) + "%p";
  const times = (v, d = 1) => v == null ? "–" : v.toFixed(d) + "배";
  const signed = (v, d = 2) => v == null ? "–" : (v >= 0 ? "+" : "") + v.toFixed(d);
  const md = w => { const [, m, d] = w.split("-"); return `${+m}/${+d}`; };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

  // ---------- 아주 작은 SVG 그리기 ----------
  // spark(values, {w,h,stroke,fill,base}) → svg 문자열. null은 끊어 그림.
  function spark(vals, o = {}) {
    const w = o.w || 120, h = o.h || 32, p = 2, v = vals.filter(x => x != null);
    if (!v.length) return `<svg width="${w}" height="${h}"></svg>`;
    let lo = Math.min(...v, o.base ?? Infinity), hi = Math.max(...v, o.base ?? -Infinity); if (lo === hi) { lo -= 1; hi += 1; }
    const X = i => p + i * (w - 2 * p) / Math.max(1, vals.length - 1), Y = x => h - p - (x - lo) * (h - 2 * p) / (hi - lo);
    let d = "", pen = false; vals.forEach((x, i) => { if (x == null) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(x).toFixed(1); pen = true; });
    const base = o.base != null ? `<line x1="${p}" x2="${w - p}" y1="${Y(o.base)}" y2="${Y(o.base)}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="2 2"/>` : "";
    const li = vals.length - 1 - [...vals].reverse().findIndex(x => x != null);
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${base}<path d="${d}" fill="none" stroke="${o.stroke || "currentColor"}" stroke-width="${o.sw || 1.5}" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(li)}" cy="${Y(vals[li])}" r="2.5" fill="${o.stroke || "currentColor"}"/></svg>`;
  }

  return {load, idx, latestWeek, aiWeek, weekly, summary, communities, comName, boardsOf, ser, at, lastN, weeksN, postsIndex,
    block, net, sentShares, topicName, opinionName, topicNeg, candidates, deepread, CONF, rising, reps, beforeAfterNeg, updatesIn, eventsIn,
    pcbang, steam, chosenCombo, spendTotal, num, pct, pp, times, signed, md, esc, spark};
})();
/* ===== /VOC KIT ===== */

/* ---------- 이 견본 전용 ---------- */
const COLOR = {inven: "#2a78d6", arca: "#eb6834", lostark_free: "#1baf7a", reddit: "#6250d6"};
const LV = {"높음": "#d03b3b", "보통": "#ec835a", "관찰": "#fab219"};
const LV_ICON = {"높음": "▲", "보통": "◆", "관찰": "●"};
const AI_ICON = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0l1.4 4.6L12 6 7.4 7.4 6 12 4.6 7.4 0 6l4.6-1.4z" fill="currentColor"/></svg>`;
const E = K.esc;
let S = {D: null, region: "국내", sel: null};
const tip = document.getElementById("tip");

function showTip(html, x, y) {
  tip.innerHTML = html; tip.style.opacity = 1;
  const r = tip.getBoundingClientRect();
  let L = x + 14, T = y + 14;
  if (L + r.width > innerWidth - 8) L = x - r.width - 14;
  if (T + r.height > innerHeight - 8) T = y - r.height - 14;
  tip.style.left = Math.max(8, L) + "px"; tip.style.top = Math.max(8, T) + "px";
}
const hideTip = () => { tip.style.opacity = 0; };

function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || 10 * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, out = [];
  for (let v = a; v <= b + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}

/* 선 차트(툴팁 포함). series:[{name,color,vals,dash}], marks: 13칸 bool(이슈 후보 주) */
function mountLine(el, o) {
  const W = Math.max(280, el.clientWidth || 600), H = o.h || 230, m = {l: 48, r: 14, t: 12, b: 28};
  const all = o.series.flatMap(s => s.vals).filter(v => v != null).concat(o.extra || []);
  if (!all.length) { el.innerHTML = `<div class="calcnote">그릴 값이 없습니다(수집 전 또는 평시 산출 전).</div>`; return; }
  let lo = Math.min(...all), hi = Math.max(...all);
  if (o.zero) lo = Math.min(0, lo);
  if (lo === hi) { lo -= 1; hi += 1; }
  const ticks = niceTicks(lo, hi, 4); lo = ticks[0]; hi = ticks[ticks.length - 1];
  const n = o.weeks.length, X = i => m.l + i * (W - m.l - m.r) / Math.max(1, n - 1), Y = v => m.t + (hi - v) * (H - m.t - m.b) / (hi - lo);
  let g = "";
  ticks.forEach(t => { g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="#ecebe5"/><text x="${m.l - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="#8a8882" class="num">${o.fmt(t, true)}</text>`; });
  o.weeks.forEach((w, i) => { if (i % (n > 8 ? 2 : 1) === 0 || i === n - 1) g += `<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="#8a8882">${K.md(w)}</text>`; });
  if (o.marks) o.marks.forEach((b, i) => { if (b) g += `<rect x="${X(i) - 5}" y="${H - m.b + 2}" width="10" height="4" rx="1" fill="#3a2f98"/>`; });
  if (o.hl != null) g += `<rect x="${X(o.hl) - 12}" y="${m.t}" width="24" height="${H - m.t - m.b}" fill="#3a2f98" opacity=".06"/>`;
  o.series.forEach(s => {
    let d = "", pen = false;
    s.vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1); pen = true; });
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" ${s.dash ? 'stroke-dasharray="5 4" opacity=".7"' : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
    if (!s.dash) { const li = s.vals.length - 1 - [...s.vals].reverse().findIndex(v => v != null); if (li < s.vals.length && s.vals[li] != null) g += `<circle cx="${X(li)}" cy="${Y(s.vals[li])}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/>`; }
  });
  g += `<line class="guide" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="#52514e" stroke-width="1" opacity="0"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${E(o.label || "추이 차트")}">${g}<rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg>`;
  const svg = el.querySelector("svg"), guide = svg.querySelector(".guide");
  svg.querySelector(".hit").addEventListener("mousemove", ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((px - m.l) / ((W - m.l - m.r) / Math.max(1, n - 1)))));
    guide.setAttribute("x1", X(i)); guide.setAttribute("x2", X(i)); guide.setAttribute("opacity", .5);
    const rows = o.series.map(s => `<div class="tr"><span><i style="background:${s.color}"></i>${E(s.name)}</span><b>${s.vals[i] == null ? (o.nullText || "값 없음") : o.fmt(s.vals[i])}</b></div>`).join("");
    showTip(`<div class="tw">${o.weeks[i]} 주${o.marks && o.marks[i] ? " · 이슈 후보" : ""}</div>${rows}`, ev.clientX, ev.clientY);
  });
  svg.querySelector(".hit").addEventListener("mouseleave", () => { guide.setAttribute("opacity", 0); hideTip(); });
}

/* 카드용 스파크라인 + 툴팁 */
function sparkHTML(vals, color, base) {
  return K.spark(vals, {w: 260, h: 42, stroke: color, sw: 2, base}).replace('width="260" height="42"', 'preserveAspectRatio="none"');
}
function bindSpark(el, weeks, vals, fmt) {
  el.addEventListener("mousemove", ev => {
    const r = el.getBoundingClientRect(), i = Math.max(0, Math.min(vals.length - 1, Math.round((ev.clientX - r.left) / r.width * (vals.length - 1))));
    showTip(`<div class="tw">${weeks[i]} 주</div><div class="tr"><span>값</span><b>${vals[i] == null ? "값 없음" : fmt(vals[i])}</b></div>`, ev.clientX, ev.clientY);
  });
  el.addEventListener("mouseleave", hideTip);
}

const parseId = id => { const [w, com, ...rest] = id.split("/"); return {week: w, com, metric: rest.join("/")}; };
const fmtPct = (v, axis) => v == null ? "–" : (v * 100).toFixed(axis ? 0 : 1) + "%";
const fmtIdx = v => v == null ? "–" : Math.round(v).toString();
const fmtNum = v => K.num(v);

function readGroups(dr) {
  const g = {"추천 상위": 0, "무작위": 0};
  (dr.read || []).forEach(r => { g[r.group] = (g[r.group] || 0) + 1; });
  return `${dr.read.length}건 정독 · 추천 상위 ${g["추천 상위"]} · 무작위 ${g["무작위"]}`;
}
const modelName = m => ({"claude-opus-5-5": "Opus 5.5", "claude-haiku-5-5": "Haiku 5.5", "claude-sonnet-5-5": "Sonnet 5.5"}[m] || m);

/* ---------- 화면 만들기 ---------- */
function render() {
  const D = S.D, region = S.region, week = K.aiWeek(D, region), wi = K.idx(D, week);
  const W = K.weekly(D, region, week), weeks13 = K.weeksN(D, week);
  const coms = K.communities(D, region);
  const latest = S.games.games.find(g => g.file).latest_week;
  document.getElementById("weekline").innerHTML = `기준 주 <b>${week}</b> (AI 해석이 있는 가장 최근 주) · 최신 수집 주 ${latest}${latest !== week ? " — 이 주는 이슈 후보가 없어 AI 결론이 없음" : ""} · ${region === "해외" ? "해외는 레딧 한 곳만 수집" : "국내 " + coms.length + "곳 나란히 비교(합산하지 않음)"}`;

  const items = W.items.filter(it => it.draft || it.judgment);
  const cards = [];   // {key, html, after(el)}
  // 이슈 후보 카드
  items.forEach((it, n) => {

    const vals = K.lastN(K.ser(D, scope, p.metric, "value"), wi), base = K.lastN(K.ser(D, scope, p.metric, "base"), wi);
    const dr = K.deepread(D, it.id), lv = (it.judgment || {}).level || (it.draft || {}).level;
    cards.push({key: "issue:" + it.id, ref: n + 1, com: p.com, item: it, vals, base, html: `
      <div class="k-label"><span class="dot" style="background:${COLOR[p.com]}"></span>${E(it.community)}</div>
      <div class="k-issue">${E(it.issue)}</div>
      <div class="k-big"><span class="v">${E(it.change)}</span><span class="cmp num">${E(it.value)}</span></div>
      <div class="k-spark" data-sp>${sparkHTML(vals, COLOR[p.com], base[base.length - 1])}</div>
      <div class="k-foot"><span>${K.md(weeks13[0])} ~ ${K.md(week)} · 점선 = 평시</span><span class="num">${K.num(it.count)}건</span></div>
      <div class="k-ai">
        <div class="badges">
          ${lv ? `<span class="badge lv"><span style="color:${LV[lv]}" aria-hidden="true">${LV_ICON[lv]}</span> AI 판단 초안 ${E(lv)}</span>` : ""}
          ${dr ? `<span class="badge ai">${AI_ICON} 정독 신뢰도 ${K.CONF[dr.result.confidence] || "–"}</span>` : ""}
        </div>
        ${it.draft && it.draft.reason ? `<div>판단 이유(AI 초안): ${E(it.draft.reason)}</div>` : ""}
      </div>`, fmt: fmtPct});
  });
  // 글 수 지수 카드
  coms.forEach(c => {
    const scope = "community:" + c.id, ratio = K.lastN(K.ser(D, scope, "posts", "ratio"), wi).map(v => v == null ? null : v * 100);
    const cnt = K.at(D, scope, "posts", "value", week), base = K.at(D, scope, "posts", "base", week), ix = K.postsIndex(D, scope, week);
    cards.push({key: "posts:" + c.id, com: c.id, kind: "posts", vals: ratio, html: `
      <div class="k-label"><span class="dot" style="background:${COLOR[c.id]}"></span>${E(c.name)}</div>
      <div class="k-issue">글 수 지수 <span style="font-weight:500;color:var(--muted)">(평시 = 100)</span></div>
      <div class="k-big">${ix == null ? `<span class="null">평시 산출 전</span>` : `<span class="v">${ix}</span>`}<span class="cmp num">${K.num(cnt)}건${base != null ? " · 평시 " + K.num(base) + "건" : ""}</span></div>
      <div class="k-spark" data-sp>${ratio.some(v => v != null) ? sparkHTML(ratio, COLOR[c.id], 100) : `<div class="calcnote">평시 산출에 최소 4주 필요 — 자유게시판은 ${D.weeks[49]} 주부터 수집</div>`}</div>
      <div class="k-foot"><span>점선 = 평시 100</span><span class="badge calc">데이터 계산</span></div>`, fmt: fmtIdx});
  });
  // 감성(부정 비율) 카드
  coms.forEach(c => {
    const scope = "community:" + c.id, vals = K.lastN(K.ser(D, scope, "neg", "value"), wi);
    const v = K.at(D, scope, "neg", "value", week), b = K.at(D, scope, "neg", "base", week), bl = K.block(D, scope, week);
    cards.push({key: "neg:" + c.id, com: c.id, kind: "neg", vals, html: `
      <div class="k-label"><span class="dot" style="background:${COLOR[c.id]}"></span>${E(c.name)}</div>
      <div class="k-issue">부정 비율</div>
      <div class="k-big"><span class="v">${K.pct(v)}</span><span class="cmp num">${b != null ? "평시 " + K.pct(b) + " · " + K.pp(v - b) : "평시 산출 전"}</span></div>
      <div class="k-spark" data-sp>${sparkHTML(vals, COLOR[c.id], b)}</div>
      <div class="k-foot"><span class="num">순감성 ${bl && bl.net != null ? K.signed(bl.net) : "–"} · 분류 ${K.num(bl ? bl.n : null)}건</span><span class="badge calc">데이터 계산</span></div>`, fmt: fmtPct});
  });
  // 게임 지표 카드 (줄 정렬: 글 수 줄 끝에 PC방, 감성 줄 끝에 스팀)
  const pc = K.pcbang(D, week), st = K.steam(D, week);
  const pcVals = weeks13.map(w => { const x = K.pcbang(D, w); return x ? x.share : null; });
  const stVals = weeks13.map(w => { const x = K.steam(D, w); return x ? x.max : null; });
  const pcAI = pc && /자동 읽기/.test(pc.source || "");
  const pcCard = ({key: "game:pc", kind: "pc", vals: pcVals, html: `
    <div class="k-label"><span class="dot" style="background:#898781"></span>게임 지표 · 국내</div>
    <div class="k-issue">PC방 점유율</div>
    <div class="k-big"><span class="v">${pc ? pc.share.toFixed(2) + "%" : "–"}</span><span class="cmp num">${pc ? pc.rank + "위 · 전주 대비 " + (pc.wow > 0 ? "+" : "") + pc.wow + "%(사용 시간)" : "자료 없음"}</span></div>
    <div class="k-spark" data-sp>${sparkHTML(pcVals, "#52514e")}</div>
    <div class="k-foot"><span>${pc ? E(pc.source) : ""}</span>${pcAI ? `<span class="badge ai">${AI_ICON} AI 읽기</span>` : `<span class="badge calc">사람 읽기</span>`}</div>`, fmt: v => v.toFixed(2) + "%"});
  cards.splice(cards.findIndex(c => c.key.startsWith("neg:")), 0, pcCard);
  cards.push({key: "game:steam", kind: "steam", vals: stVals, html: `
    <div class="k-label"><span class="dot" style="background:#898781"></span>게임 지표 · 해외</div>
    <div class="k-issue">스팀 최고 동시 접속</div>
    <div class="k-big"><span class="v">${st ? K.num(st.max) : "–"}</span><span class="cmp num">${st && st.avg != null ? "평균 " + K.num(st.avg) + "명" : "평균 자료 없음"}</span></div>
    <div class="k-spark" data-sp>${sparkHTML(stVals, "#52514e")}</div>
    <div class="k-foot"><span>SteamCharts · 주간 최고값</span><span class="badge calc">데이터 계산</span></div>`, fmt: v => K.num(v) + "명"});

  // 문장 → 카드 연결
  const sents = [];
  if (W.conclusion) sents.push({concl: true, text: W.conclusion, targets: (W.insights.length ? W.insights : items.map(i => i.id)).map(id => "issue:" + id)});
  items.forEach((it, n) => {
    if (!it.draft || !it.draft.insight) return;
    const p = parseId(it.id), rel = /neg/.test(p.metric) ? "neg:" + p.com : "posts:" + p.com;
    sents.push({text: it.draft.insight, who: it.community, whoIssue: it.issue, com: p.com, ref: n + 1, targets: ["issue:" + it.id, rel]});
  });

  const app = document.getElementById("app");
  if (!W.conclusion) { app.innerHTML = `<div class="state">이 주는 이슈 후보가 없어 AI 결론이 없습니다.</div>`; return; }
  app.innerHTML = `
  <section class="pulse" aria-label="AI 해석">
    <div class="pulse-head"><span class="ai-tag">${AI_ICON} AI 초안 · 이번 주 결론과 이슈별 인사이트</span><span class="hint">문장에 마우스를 올리거나 눌러 근거 카드로 잇기 · 담당자 확인 전</span></div>
    <p class="para">${sents.map((s, i) => `<span class="sent${s.concl ? " concl" : ""}" tabindex="0" data-s="${i}">${s.who ? `<span class="who"><i style="background:${COLOR[s.com]}"></i>${E(s.who)} · ${E(s.whoIssue)}</span>` : ""}${E(s.text.replace(/[.。]\s*$/, ""))}.${s.ref ? `<sup class="ref">${s.ref}</sup>` : ""}</span> `).join("")}</p>
    <div class="trustrow">
      <span>쓴 것: <b>이번 주 결론 1문장 · 이슈별 인사이트 ${sents.length - 1}문장</b>(판단 초안)</span>
      <span>정독: <b>후보마다 ${(K.deepread(D, (items[0] || {}).id) || {read: []}).read.length || 6}건</b>(추천 상위 3 · 무작위 3, ${modelName(D.method.deepread.model)})</span>
      <span>이슈 후보 <b class="num">${W.items.length}건</b> · 판단 수준 높음 <b class="num">${items.filter(i => (i.judgment || {}).level === "높음").length}</b> · 보통 <b class="num">${items.filter(i => (i.judgment || {}).level === "보통").length}</b> · 관찰 <b class="num">${items.filter(i => (i.judgment || {}).level === "관찰").length}</b></span>
    </div>
  </section>
  <section class="block"><div class="block-h"><h2>판단할 이슈 후보</h2><span class="note">숫자는 데이터 계산 · 보라색 줄은 AI 초안 · 카드를 누르면 원 차트</span></div><div class="grid" id="g-issue"></div></section>
  <section class="block"><div class="block-h"><h2>글 수 · 감성 · 게임 지표</h2><span class="note">커뮤니티별 평시(직전 8주 평균)와 비교</span></div><div class="grid" id="g-kpi"></div></section>
  <section class="block" id="detail-sec"><div class="block-h"><h2>원 차트</h2><span class="note" id="detail-note">선택한 카드의 13주 추이와 근거</span></div><div class="detail" id="detail"></div></section>`;

  const gI = document.getElementById("g-issue"), gK = document.getElementById("g-kpi");
  cards.forEach(c => {
    const el = document.createElement("article");
    el.className = "card"; el.tabIndex = 0; el.dataset.key = c.key;
    el.innerHTML = (c.ref ? `<span class="refno">${c.ref}</span>` : "") + c.html;
    (c.key.startsWith("issue:") ? gI : gK).appendChild(el);
    const sp = el.querySelector("[data-sp]"); if (sp && c.vals) bindSpark(sp, weeks13, c.vals, c.fmt);
    const open = () => { S.sel = c.key; renderDetail(cards, true); };
    el.addEventListener("click", open);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  });
  if (!S.sel || !cards.find(c => c.key === S.sel)) S.sel = cards[0] && cards[0].key;
  renderDetail(cards, false);

  // 문장 hover ↔ 카드
  document.querySelectorAll(".sent").forEach(el => {
    const s = sents[+el.dataset.s];
    const on = () => link(el, s.targets), off = () => unlink();
    el.addEventListener("mouseenter", on); el.addEventListener("focus", on);
    el.addEventListener("mouseleave", off); el.addEventListener("blur", off);
    el.addEventListener("click", () => { const t = s.targets[0]; const card = document.querySelector(`.card[data-key="${CSS.escape(t)}"]`); if (card) { S.sel = t; renderDetail(cards, false); card.scrollIntoView({behavior: "smooth", block: "center"}); } });
  });
}

function link(sentEl, targets) {
  unlink();
  document.body.classList.add("linking"); sentEl.classList.add("on");
  const svg = document.getElementById("links");
  svg.setAttribute("width", document.documentElement.scrollWidth); svg.setAttribute("height", document.documentElement.scrollHeight);
  const rs = sentEl.getClientRects(), last = rs[rs.length - 1] || sentEl.getBoundingClientRect();
  const sx = last.right - Math.min(last.width, 40) / 2 + scrollX, sy = last.bottom + scrollY + 2;
  let g = `<circle cx="${sx}" cy="${sy}" r="3.5"/>`;
  targets.forEach(t => {
    const c = document.querySelector(`.card[data-key="${CSS.escape(t)}"]`); if (!c) return;
    c.classList.add("lit");
    const r = c.getBoundingClientRect(), tx = r.left + r.width / 2 + scrollX, ty = r.top + scrollY - 2, my = (sy + ty) / 2;
    g += `<path d="M${sx} ${sy} C ${sx} ${my}, ${tx} ${my}, ${tx} ${ty}"/><circle cx="${tx}" cy="${ty}" r="3.5"/>`;
  });
  svg.innerHTML = g;
}
function unlink() {
  document.body.classList.remove("linking");
  document.querySelectorAll(".card.lit").forEach(c => c.classList.remove("lit"));
  document.querySelectorAll(".sent.on").forEach(c => c.classList.remove("on"));
  document.getElementById("links").innerHTML = "";
}

function renderDetail(cards, scroll) {
  const D = S.D, region = S.region, week = K.aiWeek(D, region), wi = K.idx(D, week), weeks13 = K.weeksN(D, week);
  const c = cards.find(x => x.key === S.sel); if (!c) return;
  document.querySelectorAll(".card").forEach(el => el.classList.toggle("sel", el.dataset.key === c.key));
  const el = document.getElementById("detail"), coms = K.communities(D, region);
  let left = "", right = "", chartOpts = null;
  if (c.item) {
    const it = c.item, p = parseId(it.id), dr = K.deepread(D, it.id), cand = K.candidates(D, region, week).find(x => x.id === it.id);
    left = `<h3>${c.ref ? `<span class="badge ai" style="margin-right:6px">${c.ref}</span>` : ""}${E(it.community)} · ${E(it.issue)}</h3>
      <div class="dsub num">${E(it.facts)} · ${it.streak}주 연속 후보</div>
      <div class="legend"><span><i class="ln" style="background:${COLOR[p.com]}"></i>이번 주 값</span><span><i class="ln dash"></i>평시(직전 8주 평균)</span><span><i class="mk"></i>이슈 후보였던 주</span></div>
      <div class="chart" id="dchart"></div>
      ${cand && cand.others && cand.others.length ? `<div class="cmp-tbl"><h4>같은 지표, 다른 커뮤니티(합산하지 않고 나란히)</h4><table class="t num"><thead><tr><th>커뮤니티</th><th class="r">이번 주</th><th class="r">평시 대비</th><th class="r">건수</th></tr></thead><tbody>
        <tr><td><span class="dot" style="display:inline-block;background:${COLOR[p.com]};margin-right:6px"></span>${E(it.community)}</td><td class="r">${K.pct(cand.value)}</td><td class="r">${cand.ratio != null ? K.times(cand.ratio) : K.pp(cand.value - cand.base)}</td><td class="r">${K.num(cand.count)}</td></tr>
        ${cand.others.map(o => { const id = (D.communities.find(x => x.name === o.community) || {}).id; return `<tr><td><span class="dot" style="display:inline-block;background:${COLOR[id] || "#898781"};margin-right:6px"></span>${E(o.community)}</td><td class="r">${K.pct(o.value)}</td><td class="r">${o.ratio == null ? "평시 산출 전" : K.times(o.ratio)}</td><td class="r">${K.num(o.count)}</td></tr>`; }).join("")}
        </tbody></table><div class="calcnote">판정에 쓰인 기준: ${E((cand.rules || []).join(" · "))} · 데이터 계산</div></div>` : ""}
      ${it.draft ? `<div class="aibox" style="margin-top:18px"><div class="aihead"><span class="ai-tag">${AI_ICON} AI 판단 초안</span>${it.judgment ? `<span class="badge lv"><span style="color:${LV[it.judgment.level]}" aria-hidden="true">${LV_ICON[it.judgment.level]}</span> 수준 ${E(it.judgment.level)}</span>` : ""}<span style="font-size:12px;color:#6c64b0">작성 주체: ${E((it.judgment || {}).by || "AI 초안")} · 담당자 확인 전</span></div>
        <p><b>인사이트</b> ${E(it.draft.insight)}</p><p style="margin:0"><b>판단 이유</b> ${E(it.draft.reason)}</p></div>
        ${it.draft.notice ? `<div class="calcnote">같은 주 운영 공지(데이터): ${E(it.draft.notice.date)} · ${E(it.draft.notice.kind)} · ${E(it.draft.notice.title)}</div>` : `<div class="calcnote">같은 주 운영 공지: 없음(데이터)</div>`}` : ""}`;
    chartOpts = {weeks: weeks13, series: [{name: it.community, color: COLOR[p.com], vals: c.vals}, {name: "평시", color: "#52514e", vals: c.base, dash: true}], marks: it.history, fmt: fmtPct, zero: true, hl: weeks13.length - 1, label: it.issue + " 13주 추이"};
    if (dr) {
      const R = dr.result;
      right = `<div class="aibox">
        <div class="aihead"><span class="ai-tag">${AI_ICON} AI 정독 요약(${modelName(dr.model)} · ${dr.read.length}건 정독)</span><span class="badge lv">신뢰도 ${K.CONF[R.confidence] || "–"}</span></div>
        <p>${E(R.summary)}</p>
        <ul>${(R.subissues || []).map(s => `<li><b>${E(s.name)}</b> <span class="num" style="color:#6c64b0">· 정독 글 중 ${s.count}건</span>${s.quote ? `<q>${E(s.quote)}</q><span style="font-size:11.5px;color:#6c64b0">${s.quote_post}번 글 인용</span>` : ""}</li>`).join("")}</ul>
      </div>
      <div class="reads"><h4>정독한 원문 · ${readGroups(dr)}</h4><ol>${dr.read.map(r => `<li><a href="${E(r.url)}" target="_blank" rel="noopener">${E(r.title)}</a><span class="g num">${E(r.group)} · 추천 ${r.recommends} · 댓글 ${r.comments} · ${E(r.date)}</span></li>`).join("")}</ol></div>
      <div class="calcnote">요약 · 하위 문제 · 신뢰도는 AI가 쓴 것이고 담당자 확인 전입니다. 표본이 ${dr.read.length}건이라 커뮤니티 전체 의견을 대표하지 않습니다.</div>`;
    } else right = `<div class="calcnote">이 후보에는 정독 요약이 없습니다.</div>`;
  } else {
    let series = [], title = "", fmt = fmtPct, sub = "", nullText;
    if (c.kind === "posts") { title = "글 수 지수(평시 = 100)"; fmt = fmtIdx; nullText = "평시 산출 전"; series = coms.map(x => ({name: x.name, color: COLOR[x.id], vals: K.lastN(K.ser(D, "community:" + x.id, "posts", "ratio"), wi).map(v => v == null ? null : v * 100)})); sub = "커뮤니티별 이번 주 글 수 ÷ 평시(직전 8주 평균) × 100. 인벤은 자유게시판 수집이 짧아 평시 산출 전이라 선이 없습니다."; }
    else if (c.kind === "neg") { title = "부정 비율"; series = coms.map(x => ({name: x.name, color: COLOR[x.id], vals: K.lastN(K.ser(D, "community:" + x.id, "neg", "value"), wi)})); sub = "분류한 글 가운데 부정 감성 비율(주제 '기타' 제외). 커뮤니티마다 성향이 달라 합산하지 않습니다."; }
    else if (c.kind === "pc") { title = "PC방 점유율(더로그 주간 리포트)"; fmt = v => v.toFixed(2) + "%"; series = [{name: "점유율", color: "#52514e", vals: c.vals}]; sub = "주간 PC방 사용 시간 점유율. 출처 표를 사람이 읽었거나 AI(Haiku 5.5)가 그림을 읽은 값으로, 주마다 출처 표시가 다릅니다."; }
    else { title = "스팀 최고 동시 접속(SteamCharts)"; fmt = v => K.num(v); series = [{name: "최고 동시 접속", color: "#52514e", vals: c.vals}]; sub = "해외 서버(스팀) 주간 최고 동시 접속자 수. 2026-08-03 주부터."; }
    left = `<h3>${title}</h3><div class="dsub">${sub}</div>${series.length > 1 ? `<div class="legend">${series.map(s => `<span><i class="ln" style="background:${s.color}"></i>${E(s.name)}</span>`).join("")}${c.kind === "posts" ? `<span><i class="ln dash"></i>평시 100</span>` : ""}</div>` : ""}<div class="chart" id="dchart"></div>`;
    if (c.kind === "posts") series.push({name: "평시", color: "#52514e", vals: weeks13.map(() => 100), dash: true});
    chartOpts = {weeks: weeks13, series, fmt, nullText, zero: c.kind !== "steam", hl: weeks13.length - 1, label: title};
    const rows = c.kind === "posts" || c.kind === "neg" ? coms.map(x => {
      const sc = "community:" + x.id;
      if (c.kind === "posts") return `<tr><td><span class="dot" style="display:inline-block;background:${COLOR[x.id]};margin-right:6px"></span>${E(x.name)}</td><td class="r">${K.num(K.at(D, sc, "posts", "value", week))}</td><td class="r">${K.num(K.at(D, sc, "posts", "base", week))}</td><td class="r">${K.postsIndex(D, sc, week) ?? "평시 산출 전"}</td></tr>`;
      const v = K.at(D, sc, "neg", "value", week), b = K.at(D, sc, "neg", "base", week);
      return `<tr><td><span class="dot" style="display:inline-block;background:${COLOR[x.id]};margin-right:6px"></span>${E(x.name)}</td><td class="r">${K.pct(v)}</td><td class="r">${K.pct(b)}</td><td class="r">${b == null ? "–" : K.pp(v - b)}</td></tr>`;
    }).join("") : "";
    right = rows ? `<div class="cmp-tbl" style="margin-top:0"><h4>${week} 주 값 (데이터 계산)</h4><table class="t num"><thead><tr><th>커뮤니티</th>${c.kind === "posts" ? `<th class="r">글 수</th><th class="r">평시</th><th class="r">지수</th>` : `<th class="r">부정</th><th class="r">평시</th><th class="r">차이</th>`}</tr></thead><tbody>${rows}</tbody></table></div>
      <div class="calcnote">이 카드는 AI가 쓴 글이 없는 계산 지표입니다. 위 AI 문장 가운데 이 카드로 이어지는 문장이 근거로 삼은 숫자입니다.</div>`
      : `<div class="cmp-tbl" style="margin-top:0"><h4>최근 4주 (데이터 계산)</h4><table class="t num"><thead><tr><th>주</th><th class="r">값</th>${c.kind === "pc" ? `<th class="r">순위</th><th>출처</th>` : `<th class="r">평균</th>`}</tr></thead><tbody>${weeks13.slice(-4).reverse().map(w => { if (c.kind === "pc") { const x = K.pcbang(D, w); return `<tr><td>${w}</td><td class="r">${x ? x.share.toFixed(2) + "%" : "–"}</td><td class="r">${x ? x.rank + "위" : "–"}</td><td style="font-size:12px;color:var(--muted)">${x ? `<a href="${E(x.url)}" target="_blank" rel="noopener">${E(x.source)}</a>` : ""}</td></tr>`; } const x = K.steam(D, w); return `<tr><td>${w}</td><td class="r">${x ? K.num(x.max) : "–"}</td><td class="r">${x && x.avg != null ? K.num(x.avg) : "–"}</td></tr>`; }).join("")}</tbody></table></div>`;
  }
  el.innerHTML = `<div>${left}</div><div>${right}</div>`;
  const ch = document.getElementById("dchart"); if (ch && chartOpts) { S.lastChart = chartOpts; mountLine(ch, chartOpts); }
  if (scroll) document.getElementById("detail-sec").scrollIntoView({behavior: "smooth", block: "start"});
}

/* ---------- 시작 ---------- */
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  S.region = b.dataset.region; S.sel = null;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));
let rT; addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { unlink(); const ch = document.getElementById("dchart"); if (ch && S.lastChart) mountLine(ch, S.lastChart); }, 150); });

K.load().then(({games, D}) => {
  S.D = D; S.games = games;
  document.getElementById("gen").textContent = (D.generated_at || "").replace("T", " ").replace(/\+.*/, "") + " (KST)";
  render();
  document.body.dataset.ready = "1";
}).catch(err => {
  console.warn(err);
  document.getElementById("weekline").textContent = "";
  document.getElementById("app").innerHTML = `<div class="state err">데이터를 읽지 못했습니다: ${K.esc(err.message)}<br><span style="color:var(--ink2);font-size:14px">저장소 루트에서 정적 서버로 여세요(예: python3 -m http.server).</span></div>`;
  document.body.dataset.ready = "error";
});
</script>
</body>
</html>
