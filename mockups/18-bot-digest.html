<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>18 메신저 다이제스트 · 로스트아크 VOC 견본</title>
<style>
:root{
  color-scheme: light;
  --page:#e4e7ea; --win:#ffffff; --side:#1f2d35; --side2:#2b3c46; --side-ink:#c9d3d8; --side-muted:#8a9aa3;
  --ink:#1a1d1f; --ink2:#4f565b; --muted:#868d92; --hair:#e3e6e8; --hover:#f6f7f8;
  --link:#1d63b8;
  --ai:#9a5b00; --ai-bg:#fdf5e6; --ai-line:#ecc98a;
  --data:#38444b; --data-bg:#f4f6f7;
  --c-inven:#2a78d6; --c-arca:#eb6834; --c-free:#1baf7a; --c-reddit:#6250d6;
  --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
  --font: "Segoe UI", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1000px;margin:28px auto;display:grid;grid-template-columns:232px minmax(0,1fr);background:var(--win);border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06),0 12px 40px rgba(20,30,40,.12);min-height:calc(100vh - 56px)}

/* 사이드바 */
.side{background:var(--side);color:var(--side-ink);padding:16px 0;display:flex;flex-direction:column;gap:18px}
.ws{padding:0 16px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.ws b{display:block;color:#fff;font-size:16px}
.ws span{font-size:12px;color:var(--side-muted)}
.grp h4{margin:0 0 4px;padding:0 16px;font-size:12px;font-weight:600;color:var(--side-muted)}
.ch{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:5px 16px;color:var(--side-ink);cursor:pointer;font-size:14.5px}
.ch:hover{background:var(--side2)}
.ch[aria-current="true"]{background:#2f6f9f;color:#fff;font-weight:600}
.ch .hash{opacity:.7;width:12px}
.ch small{margin-left:auto;font-size:11px;opacity:.75}
.sub-box{margin:0 12px;padding:12px;border-radius:10px;background:var(--side2);font-size:12.5px}
.sub-box .t{color:#fff;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px}
.sub-box label{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;color:var(--side-ink)}
.sub-box input{accent-color:#59a8e0}
.sub-box .when{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);color:var(--side-muted);line-height:1.45}
.ex{display:inline-block;font-size:10.5px;font-weight:700;color:#4a3300;background:#ffd66b;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.bot-card{margin:auto 12px 0;font-size:12px;color:var(--side-muted);line-height:1.45;padding:10px 4px 0;border-top:1px solid rgba(255,255,255,.08)}

/* 채널 */
.main{display:flex;flex-direction:column;min-width:0}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);z-index:5}
.chead h1{margin:0;font-size:17px;font-weight:700}
.chead p{margin:1px 0 0;font-size:12.5px;color:var(--ink2)}
.tbtn{border:1px solid var(--hair);background:#fff;border-radius:8px;padding:6px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.feed{padding:6px 0 10px;flex:1}
.older{margin:10px 22px 4px;display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px}
.older::before,.older::after{content:"";flex:1;height:1px;background:var(--hair)}
.older button{border:1px solid var(--hair);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer}
.day{display:flex;align-items:center;gap:10px;margin:14px 22px 2px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.day::before,.day::after{content:"";flex:1;height:1px;background:var(--hair)}
.day span{border:1px solid var(--hair);border-radius:999px;padding:2px 12px;background:#fff}

.msg{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding:10px 22px}
.msg:hover{background:var(--hover)}
.av{width:40px;height:40px;border-radius:9px;display:block}
.who{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px}
.who b{font-size:15px}
.app-tag{font-size:10.5px;font-weight:700;color:var(--ink2);background:#e9ecee;border-radius:3px;padding:0 4px}
.who time{font-size:12px;color:var(--muted)}
.body{margin-top:2px}
.body p{margin:4px 0}
.concl{margin:8px 0 6px;padding:10px 14px;border-left:4px solid var(--ai);background:var(--ai-bg);border-radius:3px 10px 10px 3px;font-size:19px;font-weight:650;line-height:1.45;letter-spacing:-.01em}
.ai-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--ai);background:#fff;border:1px solid var(--ai-line);border-radius:999px;padding:0 7px;vertical-align:2px;white-space:nowrap}
.ai-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ai)}
.data-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--data);background:#fff;border:1px solid #cfd5d8;border-radius:3px;padding:0 6px;vertical-align:2px;white-space:nowrap}
.data-pill::before{content:"";width:6px;height:6px;background:var(--data)}
.att{margin:10px 0 4px;border:1px solid var(--hair);border-left:4px solid #9aa6ad;border-radius:4px 10px 10px 4px;padding:12px 14px;background:var(--data-bg);max-width:620px}
.att .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin-bottom:8px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:#fff;border:1px solid var(--hair);border-radius:9px;padding:10px 12px;min-width:0}
.tile .l{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile .l i{width:8px;height:8px;border-radius:50%;flex:none}
.tile .k{font-size:12px;color:var(--muted);grid-column:1/-1}
.tile .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
.tile .v.na{font-size:16px;font-weight:600;color:var(--muted);padding:8px 0 5px}
.tile .c{font-size:12.5px;color:var(--ink2);margin-top:2px}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700}
.foot{margin-top:6px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.foot .chk{display:inline-flex;align-items:center;gap:4px;color:#8a5200;background:#fff4dc;border-radius:4px;padding:0 6px;font-weight:600}
.threadbar{display:inline-flex;align-items:center;gap:8px;margin-top:6px;border:1px solid transparent;border-radius:8px;padding:4px 8px 4px 4px;background:none;cursor:pointer;font-size:13px}
.threadbar:hover{border-color:var(--hair);background:#fff}
.threadbar .stack{display:flex}
.threadbar .stack svg{width:22px;height:22px;border-radius:5px;margin-right:-6px;border:2px solid #fff}
.threadbar b{color:var(--link);margin-left:6px}
.threadbar span{color:var(--muted);font-size:12px}
.threadbar .arrow{color:var(--muted);transition:transform .15s}
.threadbar[aria-expanded="true"] .arrow{transform:rotate(90deg)}

.thread{margin:6px 0 2px;border-left:2px solid var(--hair);padding-left:14px}
.thread[hidden]{display:none}
.reply{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--hair)}
.reply:first-child{border-top:0}
.reply .av{width:28px;height:28px;border-radius:7px}
.rhead{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.rhead b{font-size:14px}
.rtitle{font-size:16px;font-weight:700;margin:4px 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rtitle i{width:9px;height:9px;border-radius:50%;flex:none}
.facts{font-size:13px;color:var(--ink2);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lvl{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:6px;border:1px solid var(--hair);background:#fff}
.lvl i{width:9px;height:9px;border-radius:2px;display:inline-block}
.ai-text{margin:8px 0 4px;padding:8px 12px;background:var(--ai-bg);border-radius:8px;border-left:3px solid var(--ai)}
.ai-text dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:4px 0 0;font-size:14px}
.ai-text dt{color:var(--ai);font-weight:700;font-size:12.5px;padding-top:1px;white-space:nowrap}
.ai-text dd{margin:0}
.ba{margin:6px 0;font-size:13px;color:var(--ink2);background:var(--data-bg);border:1px solid var(--hair);border-radius:8px;padding:7px 10px}
.evbtn{border:1px solid var(--hair);background:#fff;border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--link);font-weight:600;margin-top:4px}
.evbtn:hover{background:var(--hover)}
.ev{margin-top:8px;border:1px solid var(--hair);border-radius:10px;padding:12px 14px;background:#fff}
.ev[hidden]{display:none}
.ev .sum{font-size:14px;line-height:1.6}
.ev h5{margin:12px 0 6px;font-size:12.5px;color:var(--ink2);font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.subs{list-style:none;margin:0;padding:0}
.subs li{padding:6px 0;border-top:1px dashed var(--hair);font-size:13.5px}
.subs li:first-child{border-top:0}
.subs blockquote{margin:3px 0 0;padding:2px 0 2px 10px;border-left:3px solid #d5dadd;color:var(--ink2);font-size:13px}
.hyp{font-size:13.5px;padding:6px 10px;border:1px dashed var(--ai-line);border-radius:8px;margin-bottom:6px;background:#fffdf8}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.reads a{display:block;text-decoration:none;color:var(--ink);font-size:12.5px;border:1px solid var(--hair);border-radius:8px;padding:6px 9px;line-height:1.35}
.reads a:hover{border-color:#b8c0c5}
.reads a small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;border-radius:5px;padding:0 7px;border:1px solid var(--hair);background:#fff;color:var(--ink2);white-space:nowrap}
.resp{list-style:none;margin:8px 0 0;padding:0;max-width:620px}
.resp li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 12px;border:1px solid var(--hair);border-radius:9px;margin-bottom:6px;background:#fff}
.kind{font-size:11.5px;font-weight:700;border-radius:5px;padding:1px 7px;background:#eef2f5;color:var(--data);white-space:nowrap;align-self:start}
.resp a{font-weight:600;text-decoration:none}
.resp a:hover{text-decoration:underline}
.resp .d{grid-column:2;font-size:12px;color:var(--muted)}
.bat{width:100%;max-width:620px;border-collapse:collapse;margin-top:8px;font-size:13px}
.bat th,.bat td{padding:6px 8px;border-bottom:1px solid var(--hair);text-align:left}
.bat th{font-size:11.5px;color:var(--ink2);font-weight:600}
.bat td.r,.bat th.r{text-align:right;font-variant-numeric:tabular-nums}
.sys{display:flex;gap:10px;align-items:center;margin:8px 22px;padding:8px 12px;border-radius:8px;background:var(--hover);font-size:12.5px;color:var(--ink2)}
.composer{margin:8px 22px 16px;border:1px solid #cdd3d6;border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13.5px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hidden-note{font-size:12.5px;color:var(--muted);padding:8px 0 2px}
.compact .concl{font-size:15.5px;padding:7px 12px}
footer.meta{max-width:1000px;margin:0 auto 26px;padding:0 4px;font-size:11.5px;color:#6d757a;display:flex;flex-wrap:wrap;gap:4px 14px}
.state{padding:80px 22px;text-align:center;color:var(--ink2)}
.state.err{color:var(--st-crit)}
#tip{position:fixed;z-index:50;pointer-events:none;background:#1a1d1f;color:#fff;font-size:12px;padding:6px 9px;border-radius:6px;max-width:240px}
.mtop{display:none}

@media (max-width:820px){
  .app{grid-template-columns:1fr;margin:0;border-radius:0;min-height:100vh}
  .side{display:none}
  .mtop{display:flex;flex-direction:column;gap:8px;background:var(--side);color:var(--side-ink);padding:10px 16px}
  .mtop .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .mtop .ch{width:auto;border-radius:6px;padding:4px 10px;font-size:13.5px}
  .mtop select{font:inherit;font-size:13px;border-radius:6px;border:0;padding:4px 6px;background:var(--side2);color:#fff;max-width:100%}
  .mtop label{font-size:12px;color:var(--side-muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .chead{padding:10px 16px}
  .msg{padding:10px 14px;grid-template-columns:34px minmax(0,1fr);gap:10px}
  .av{width:34px;height:34px}
  .tiles{grid-template-columns:1fr}
  .tile{display:grid;grid-template-columns:1fr auto;align-items:center;gap:0 10px}
  .tile .l{grid-column:1/-1}
  .tile .v{font-size:24px}
  .concl{font-size:17px}
  .reads{grid-template-columns:1fr}
  .thread{padding-left:10px}
  .day,.older,.sys,.composer{margin-left:14px;margin-right:14px}
  footer.meta{padding:12px 16px;margin:0}
}
</style>
</head>
<body>
<div id="tip" hidden></div>
<div class="app">
  <aside class="side" id="side"></aside>
  <section class="main">
    <div class="mtop" id="mtop"></div>
    <header class="chead" id="chead"><div><h1># voc-국내</h1><p>불러오는 중…</p></div></header>
    <div class="feed" id="feed"><div class="state">데이터를 읽는 중…</div></div>
  </section>
</div>
<footer class="meta" id="meta">견본 18 · 메신저 다이제스트 · 견본 — 실제 데이터, 예시 값은 표시 · <a href="./index.html">견본 목록</a></footer>

<script>
/* ===== VOC KIT (데이터 읽기 공용 코드) — 각 견본 HTML 안에 그대로 복사해 쓴다 ===== */
const K = (() => {
  const ROOT = "..";               // mockups/ 아래에서 저장소 루트
  const j = p => fetch(`${ROOT}/${p}`, {cache: "no-store"}).then(r => { if (!r.ok) throw new Error(p + " HTTP " + r.status); return r.json(); });
  const opt = p => j(p).catch(() => null);

  async function load() {
    const games = await j("games.json");
    const g = games.games.find(x => x.file) || {id: "lostark", file: "data/lostark.json"};
    const [D, daily, monthly] = await Promise.all([j(g.file), opt(`data/${g.id}-daily.json`), opt(`data/${g.id}-monthly.json`)]);
    return {games, game: g, D, daily, monthly};
  }

  // ---------- 주 · 지역 ----------
  const idx = (D, week) => D.weeks.indexOf(week);
  const latestWeek = D => D.weeks[D.weeks.length - 1];
  // AI 결론(conclusion)이 있는 가장 최근 주. 없으면 마지막 주.
  function aiWeek(D, region) {
    const W = D.weekly[region] || {};
    for (let i = D.weeks.length - 1; i >= 0; i--) { const w = W[D.weeks[i]]; if (w && w.conclusion) return D.weeks[i]; }
    return latestWeek(D);
  }
  const weekly = (D, region, week) => (D.weekly[region] || {})[week] || {conclusion: null, insights: [], items: [], responses: []};
  const summary = (D, region, week) => (D.summary[region] || {})[week] || null;
  const communities = (D, region) => D.communities.filter(c => c.enabled && (!region || c.region === region));
  const comName = (D, id) => (D.communities.find(c => c.id === id) || {}).name || id;
  const boardsOf = (D, comId) => D.boards.filter(b => b.community === comId);

  // ---------- 시리즈 (52주 배열, D.weeks와 같은 순서) ----------
  // scope 예: "community:arca", "region:국내", "board:inven:6271"
  // metric 예: "posts", "neg", "topic:operation", "topic_neg:churn", "group:보석", "signal:이탈 표현", "opinion:complaint"
  // field: value(비중 또는 건수) · base(평시=직전 8주 평균) · ratio(value/base) · diff(neg류: value-base) · count · den · z · n_base
  const ser = (D, scope, metric, field = "value") => (((D.series[scope] || {})[metric] || {})[field]) || D.weeks.map(() => null);
  const at = (D, scope, metric, field, week) => ser(D, scope, metric, field)[idx(D, week)];
  const lastN = (arr, i, n = 13) => arr.slice(Math.max(0, i - n + 1), i + 1);
  const weeksN = (D, week, n = 13) => lastN(D.weeks, idx(D, week), n);

  // 글 수 지수(평시=100) — 게시판별 D.ratio[boardKey][i] * 100, 커뮤니티는 series community:<id> posts ratio
  const postsIndex = (D, scope, week) => { const r = at(D, scope, "posts", "ratio", week); return r == null ? null : Math.round(r * 100); };

  // ---------- 분류 블록(감성 · 주제 · 의견) ----------
  // block 키: "community:arca", "region:국내", "board:inven:6271"
  const block = (D, key, week) => (D.classified_blocks[key] || [])[idx(D, week)] || null;
  // 순감성 지수 = (긍정-부정)/(긍정+부정). 데이터의 net 필드가 같은 값. 주제 '기타'는 제외된 상태.
  const net = b => b ? b.net : null;
  const sentShares = b => { if (!b) return null; const o = b.overall, n = o.pos + o.neg + o.neu + o.unk; return n ? {pos: o.pos / n, neg: o.neg / n, neu: o.neu / n, unk: o.unk / n, n} : null; };
  const topicName = (D, id) => (D.topics.find(t => t.id === id) || {}).name || id;
  const opinionName = (D, id) => (D.opinions.find(t => t.id === id) || {}).name || id;
  // 주제별 부정 비율: topic_senti[t].neg / (neg+neu+pos+unk)
  function topicNeg(b) {
    if (!b || !b.topic_senti) return [];
    return Object.entries(b.topic_senti).map(([t, s]) => { const n = s.neg + s.neu + s.pos + s.unk; return {topic: t, n, neg: n ? s.neg / n : null, pos: n ? s.pos / n : null}; });
  }

  // ---------- 이슈 후보 · AI 판단 · 정독 ----------
  const candidates = (D, region, week) => ((D.candidates[region] || {})[week]) || [];
  const deepread = (D, id) => D.deepread[id] || null;     // {model, read:[{title,url,group:"추천 상위"|"무작위",recommends,comments,date}], result:{summary,subissues:[{name,count,quote,quote_post}],causes:[{event,hypothesis}],confidence:"high|medium|low",endorsed_vs_common}}
  const CONF = {high: "높음", medium: "보통", low: "낮음"};
  const rising = (D, region, week) => ((D.rising[region] || {})[week]) || [];   // [{word,count,base,ratio,new,community,reps:[{title,url,...}]}]
  const reps = (D, region, week) => (((D.representatives[region] || {})[week]) || {});   // {metricId: [{community, posts:[...]}], posts:[...]}

  // ---------- 운영 대응 ----------
  // weekly(...).responses: [{date, kind:"문제 안내|소통|제재|변경 예고", reward, title, url}]
  // 대응 전후 비교: 그 주와 다음 주의 커뮤니티 부정 비율
  function beforeAfterNeg(D, comId, week) {
    const i = idx(D, week), s = ser(D, "community:" + comId, "neg");
    return {before: s[i] ?? null, after: i + 1 < s.length ? s[i + 1] ?? null : null, nextWeek: D.weeks[i + 1] || null};
  }
  const updatesIn = (D, week) => D.updates.filter(u => u.week === week && u.server === "kr");
  const eventsIn = (D, week) => D.other_events.filter(u => u.week === week);

  // ---------- 게임 지표 ----------
  const pcbang = (D, week) => (D.game_metrics.pcbang || []).find(p => p.period_start === week) || null; // {rank, share(%), hours, wow(%), url, source}
  const steam = (D, week) => (D.game_metrics.steam || []).find(p => p.week === week) || null;          // {max, avg, granularity}

  // ---------- 만든 방법 ----------
  const chosenCombo = D => D.method.compare.combos.find(c => c.chosen);  // {name, topic:{accuracy,ci95,n}, sentiment:{...}, opinion:{...}, monthly_total_usd:[lo,hi]}
  const spendTotal = D => Object.values(D.method.spend).reduce((a, b) => a + b, 0);

  // ---------- 표시 형식 ----------
  const num = v => v == null ? "–" : Math.round(v).toLocaleString("ko-KR");
  const pct = (v, d = 1) => v == null ? "–" : (v * 100).toFixed(d) + "%";
  const pp = (v, d = 1) => v == null ? "–" : (v >= 0 ? "+" : "") + (v * 100).toFixed(d) + "%p";
  const times = (v, d = 1) => v == null ? "–" : v.toFixed(d) + "배";
  const signed = (v, d = 2) => v == null ? "–" : (v >= 0 ? "+" : "") + v.toFixed(d);
  const md = w => { const [, m, d] = w.split("-"); return `${+m}/${+d}`; };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

  // ---------- 아주 작은 SVG 그리기 ----------
  // spark(values, {w,h,stroke,fill,base}) → svg 문자열. null은 끊어 그림.
  function spark(vals, o = {}) {
    const w = o.w || 120, h = o.h || 32, p = 2, v = vals.filter(x => x != null);
    if (!v.length) return `<svg width="${w}" height="${h}"></svg>`;
    let lo = Math.min(...v, o.base ?? Infinity), hi = Math.max(...v, o.base ?? -Infinity); if (lo === hi) { lo -= 1; hi += 1; }
    const X = i => p + i * (w - 2 * p) / Math.max(1, vals.length - 1), Y = x => h - p - (x - lo) * (h - 2 * p) / (hi - lo);
    let d = "", pen = false; vals.forEach((x, i) => { if (x == null) { pen = false; return; } d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(x).toFixed(1); pen = true; });
    const base = o.base != null ? `<line x1="${p}" x2="${w - p}" y1="${Y(o.base)}" y2="${Y(o.base)}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="2 2"/>` : "";
    const li = vals.length - 1 - [...vals].reverse().findIndex(x => x != null);
    return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${base}<path d="${d}" fill="none" stroke="${o.stroke || "currentColor"}" stroke-width="${o.sw || 1.5}" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(li)}" cy="${Y(vals[li])}" r="2.5" fill="${o.stroke || "currentColor"}"/></svg>`;
  }

  return {load, idx, latestWeek, aiWeek, weekly, summary, communities, comName, boardsOf, ser, at, lastN, weeksN, postsIndex,
    block, net, sentShares, topicName, opinionName, topicNeg, candidates, deepread, CONF, rising, reps, beforeAfterNeg, updatesIn, eventsIn,
    pcbang, steam, chosenCombo, spendTotal, num, pct, pp, times, signed, md, esc, spark};
})();

const LVL = {"높음": {c: "#d03b3b", i: "▲", rank: 3}, "보통": {c: "#fab219", i: "●", rank: 2}, "관찰": {c: "#868d92", i: "○", rank: 1}};
const SUBS = [{id: "all", t: "모든 이슈 답글", min: 0}, {id: "mid", t: "보통 이상만", min: 2}, {id: "high", t: "높음만", min: 3}];

const AV = (sz = 40) => `<svg class="av" viewBox="0 0 40 40" width="${sz}" height="${sz}" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#2f6f9f"/><rect x="9" y="13" width="22" height="16" rx="5" fill="#fff"/><circle cx="16" cy="21" r="2.3" fill="#2f6f9f"/><circle cx="24" cy="21" r="2.3" fill="#9a5b00"/><path d="M20 8v5" stroke="#fff" stroke-width="2" stroke-linecap="round"/><circle cx="20" cy="7.5" r="2" fill="#ffd66b"/></svg>`;

const genDate = () => { const s = String(D.generated_at || "").slice(0, 10); if (!s) return ""; const d = new Date(s + "T00:00:00"); const wd = "일월화수목금토"[d.getDay()]; const [y, m, dd] = s.split("-"); return `${y}년 ${+m}월 ${+dd}일 ${wd}요일`; };
const lvlChip = l => { const x = LVL[l] || LVL["관찰"]; return `<span class="lvl"><i style="background:${x.c}"></i>${x.i} ${E(l || "–")}</span>`; };
const footAI = () => `<div class="foot"><span class="chk">AI가 쓴 글 · 담당자 확인 전</span><span>판단은 모두 ‘AI 초안’입니다</span></div>`;
const minRank = () => (SUBS.find(s => s.id === S.sub) || SUBS[0]).min;

/* ---------- 숫자 타일 (데이터 계산) ---------- */
function tilesFor(region, week) {
  const coms = K.communities(D, region);
  const tiles = coms.map(c => {
    const v = K.at(D, "community:" + c.id, "neg", "value", week), b = K.at(D, "community:" + c.id, "neg", "base", week);
    return {c, label: c.name, k: "부정 비율", v, b, kind: "neg"};
  });
  if (tiles.length < 3) {
    coms.forEach(c => {
      const v = K.at(D, "community:" + c.id, "posts", "value", week), b = K.at(D, "community:" + c.id, "posts", "base", week);
      tiles.push({c, label: c.name, k: "주간 글 수", v, b, kind: "posts"});
    });
  }
  if (tiles.length < 3) {
    const W = K.weekly(D, region, week);
    tiles.push({c: null, label: "이번 주", k: "이슈 후보", v: W.items.length, kind: "count", items: W.items});
  }
  return tiles.slice(0, 3).map(t => {
    const dot = t.c ? `<i style="background:${COL[t.c.id]}"></i>` : "";
    if (t.kind === "count") {
      const by = ["높음", "보통", "관찰"].map(l => [l, t.items.filter(i => i.judgment.level === l).length]).filter(x => x[1]);
      return `<div class="tile"><div class="l">${t.label}</div><div class="k">${t.k}</div><div class="v">${t.v}건</div><div class="c">AI 초안 판단 ${by.map(x => `${x[0]} ${x[1]}`).join(" · ") || "없음"}</div></div>`;
    }
    if (t.v == null) return `<div class="tile"><div class="l">${dot}${E(t.label)}</div><div class="k">${t.k}</div><div class="v na">수집 없음</div><div class="c">이 주 값 없음</div></div>`;
    const vTxt = t.kind === "neg" ? K.pct(t.v) : K.num(t.v) + "건";
    if (t.b == null) return `<div class="tile"><div class="l">${dot}${E(t.label)}</div><div class="k">${t.k}</div><div class="v">${vTxt}</div><div class="c">평시 산출 전 <span style="color:var(--muted)">(수집 ${D.rules.min_base_weeks}주 미만)</span></div></div>`;
    let dTxt, up;
    if (t.kind === "neg") { const d = t.v - t.b; up = d > 0; dTxt = K.pp(d); } else { const r = t.v / t.b; up = r > 1; dTxt = "평시의 " + Math.round(r * 100) + "%"; }
    const bad = t.kind === "neg" && up && (t.v - t.b) >= (D.rules.neg_alert_pp || .1);
    const col = t.kind === "neg" ? (bad ? "#d03b3b" : up ? "#b4521f" : "#0a7d0a") : "var(--ink2)";
    const icon = t.kind === "neg" ? (up ? "▲" : "▼") : "";
    return `<div class="tile"><div class="l">${dot}${E(t.label)}</div><div class="k">${t.k}</div><div class="v">${vTxt}</div><div class="c">평시 ${t.kind === "neg" ? K.pct(t.b) : K.num(t.b) + "건"} · <span class="delta" style="color:${col}">${icon} ${dTxt}</span>${bad ? ` <span class="badge" style="color:#d03b3b;border-color:#efb3b3">기준 +${Math.round(D.rules.neg_alert_pp * 100)}%p 넘음</span>` : ""}</div></div>`;
  }).join("");
}

      ${(R.causes || []).length ? `<h5>원인 <span class="ai-pill">가설</span></h5>${R.causes.map(c => `<div class="hyp"><b>가설</b> · ${c.event && c.event !== "없음" ? `관련 사건: ${E(c.event)}<br>` : "관련 사건 없음<br>"}${E(c.hypothesis)}</div>`).join("")}` : ""}
      ${R.endorsed_vs_common ? `<h5>추천 상위 vs 무작위 <span class="ai-pill">AI</span></h5><div style="font-size:13.5px">${E(R.endorsed_vs_common)}</div>` : ""}
      <h5>정독한 글 ${dr.read.length}건 · 원문</h5>
      <div class="reads">${dr.read.map((p, i) => `<a href="${E(p.url)}" target="_blank" rel="noopener"><small class="num">${i + 1} · ${E(p.group)} · 추천 ${K.num(p.recommends)} · 댓글 ${K.num(p.comments)} · ${E(p.date)}</small>${E(p.title)} ↗</a>`).join("")}</div>`
      : `<div style="color:var(--muted);font-size:13.5px">이 이슈는 AI 정독 요약이 없습니다.</div>`}
    </div>
    ${footAI()}
  </div></div>`;
}

/* ---------- 메시지 ---------- */
function digestHTML(region, week, opts) {
  const W = K.weekly(D, region, week);

      <div class="concl"><span class="ai-pill" style="margin-right:6px">AI 결론</span>${E(W.conclusion || "이 주는 AI 결론이 없습니다.")}</div>
      ${!compact ? `<div class="att"><div class="h"><span><span class="data-pill">데이터 계산</span> 숫자 3개 · 커뮤니티는 합치지 않고 나란히</span><span>평시 = 직전 ${D.rules.base_weeks}주 평균</span></div><div class="tiles">${tilesFor(region, week)}</div></div>` : ""}
      ${ins.length && !compact ? `<p style="font-size:14px;color:var(--ink2)">AI가 결론에 쓴 근거 이슈: ${ins.map(i => `<b style="color:var(--ink)">${E(i.community)} ${E(i.issue)}</b>`).join(", ")} · 이슈별 판단은 답글에 있습니다.</p>` : ""}
    </div>

    <div class="thread" ${open ? "" : "hidden"}>

      ${hidden ? `<div class="hidden-note">구독 수준(‘${E((SUBS.find(s => s.id === S.sub) || {}).t)}’) 때문에 답글 ${hidden}개를 숨겼습니다.</div>` : ""}
    </div>

}
function responsesHTML(region, week) {

      ${R.length ? `<ul class="resp">${R.map(r => `<li><span class="kind">${E(r.kind)}</span><a href="${E(r.url)}" target="_blank" rel="noopener">${E(r.title)} ↗</a><span class="d num">${E(r.date)}${r.reward ? " · 보상 있음" : ""}</span></li>`).join("")}</ul>` : `<p style="color:var(--ink2)">이 주에 공지된 운영 대응이 없습니다.</p>`}
      <table class="bat"><thead><tr><th>커뮤니티</th><th class="r">이번 주 부정</th><th class="r">다음 주 부정</th><th class="r">차이</th></tr></thead>
      <tbody>${rows.map(x => `<tr><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${COL[x.c.id]};margin-right:6px"></span>${E(x.c.name)}</td><td class="r">${K.pct(x.before)}</td><td class="r">${x.after == null ? "다음 주 데이터 없음" : K.pct(x.after)}</td><td class="r">${x.after == null || x.before == null ? "–" : K.pp(x.after - x.before)}</td></tr>`).join("")}</tbody></table>
      <p style="font-size:12.5px;color:var(--muted)">전후 비교는 숫자만 보여 줍니다. 대응 때문에 바뀌었는지는 판단하지 않습니다.</p>
    </div>
  </div></article>`;
}

function initOpen() {
  const w = K.aiWeek(D, S.region), W = K.weekly(D, S.region, w);
  S.open = new Set([w]);
  const first = [...W.items].sort((a, b) => (LVL[b.judgment.level] || {rank: 0}).rank - (LVL[a.judgment.level] || {rank: 0}).rank)[0];
  S.ev = new Set(first ? [first.id] : []);
}
function allOpenNow(r, w) { const W = K.weekly(D, r, w); return S.open.has(w) && W.items.every(i => S.ev.has(i.id)); }
function render() {
  renderSide();
  const r = S.region, aiW = K.aiWeek(D, r);
  const older = D.weeks.filter(w => w < aiW && K.weekly(D, r, w).conclusion).slice(-2);
  const coms = K.communities(D, r);
  $("#chead").innerHTML = `<div><h1># ${CH[r]}</h1><p>${E(r)} 커뮤니티 ${coms.length}곳(${coms.map(c => E(c.name)).join(" · ")})${r === "해외" ? " — 해외는 레딧 하나뿐" : ""} · 기준 주 ${E(aiW)}(AI 해석이 있는 가장 최근 주)</p></div>
    <button type="button" class="tbtn" id="allBtn">${allOpenNow(r, aiW) ? "모두 접기" : "답글 · 근거 모두 펼치기"}</button>`;
  $("#feed").innerHTML = `
    ${older.length ? `<div class="older"><button type="button" id="olderBtn">${S.showOlder ? "이전 다이제스트 접기" : `이전 다이제스트 ${older.length}건 보기 (${older.map(K.md).join(", ")} 주)`}</button></div>` : ""}
    ${S.showOlder ? older.map(w => digestHTML(r, w, {compact: true})).join("") : ""}
    <div class="day"><span>${E(genDate())} · 데이터 생성일</span></div>
    ${digestHTML(r, aiW, {isAi: true})}
    ${responsesHTML(r, aiW)}
    <div class="sys"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="6" fill="none" stroke="#868d92"/><path d="M7 4v3.5M7 9.6v.4" stroke="#868d92" stroke-width="1.4" stroke-linecap="round"/></svg>이 채널은 주마다 VOC 봇 다이제스트를 받습니다 · 구독 수준: ${E((SUBS.find(s => s.id === S.sub) || {}).t)} · 게시 시각은 데이터 생성 시각(${E(D.generated_at)})입니다.</div>
    <div class="composer"><span>#${CH[r]}에 메시지 보내기</span><span>견본에서는 답장을 보낼 수 없습니다</span></div>`;
  document.querySelectorAll("[data-th]").forEach(b => b.onclick = () => { const w = b.dataset.th; if (S.open.has(w)) S.open.delete(w); else S.open.add(w); render(); });
  document.querySelectorAll("[data-ev]").forEach(b => b.onclick = () => { const k = b.dataset.ev; if (S.ev.has(k)) S.ev.delete(k); else S.ev.add(k); render(); });
  const ob = $("#olderBtn"); if (ob) ob.onclick = () => { S.showOlder = !S.showOlder; render(); };
  $("#allBtn").onclick = () => {
    if (allOpenNow(r, aiW)) { S.open = new Set(); S.ev = new Set(); }
    else { S.open.add(aiW); K.weekly(D, r, aiW).items.forEach(i => S.ev.add(i.id)); }
    render();
  };
}

(async () => {
  try {
    G = await K.load();
    D = G.D;
    initOpen();
    render();
    $("#meta").innerHTML = `<span>견본 18 · 메신저 다이제스트</span><span>견본 — 실제 데이터, 예시 값은 표시(알림 시각만 예시 값)</span><span>데이터 생성 ${E(D.generated_at)}</span><a href="./index.html">견본 목록</a>`;
    document.body.dataset.ready = "1";
  } catch (e) {
    console.warn(e);
    $("#feed").innerHTML = `<div class="state err">데이터를 읽지 못했습니다: ${E(e.message)}<br><span style="color:var(--ink2)">저장소 루트에서 정적 서버로 여세요 (예: python3 -m http.server 후 /mockups/18-bot-digest.html).</span></div>`;
    document.body.dataset.ready = "error";
  }
})();
</script>
</body>
</html>
