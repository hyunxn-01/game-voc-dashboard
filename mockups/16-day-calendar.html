<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16 일별 달력 · 로스트아크 VOC 견본</title>
<style>
:root {
  --bg: #eef0ec; --surface: #ffffff; --ink: #1b1f1d; --ink-2: #4f5753; --ink-3: #8b928e; --line: #d9ddd8; --grid: #e6e9e5;
  --ai: #0f6e5c; --ai-wash: #e6f4f0; --ai-line: #a9d6ca;
  --c0: #eef4fc; --c1: #cde2fb; --c2: #9ec5f4; --c3: #6da7ec; --c4: #3987e5; --c5: #1c5cab; --c6: #0d366b;
  --sans: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans); }
button, select { font: inherit; color: inherit; }
a { color: inherit; }
.tn { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 32px 48px; }

.top { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; padding: 18px 0 14px; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand .mk { width: 34px; height: 34px; border-radius: 9px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.brand b { display: block; font-size: 15px; }
.brand small { display: block; font-size: 12px; color: var(--ink-3); }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 5px 11px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.lab { font-size: 12px; color: var(--ink-2); margin-right: 4px; }
.ctl { display: flex; align-items: center; gap: 4px; }

.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: stretch; background: var(--surface); border-radius: 16px; padding: 18px 22px; border: 1px solid var(--line); margin-bottom: 16px; }
.hero .t { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hero h1 { margin: 6px 0 4px; font-size: 24px; line-height: 1.4; letter-spacing: -.01em; }
.hero p { margin: 0; font-size: 13px; color: var(--ink-2); }
.surges { display: flex; gap: 10px; }
.sg { min-width: 150px; border-radius: 12px; padding: 10px 14px; background: #f5f7f4; border: 1px solid var(--line); cursor: pointer; text-align: left; }
.sg:hover { border-color: var(--ink); }
.sg small { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); }
.sg b { display: block; font-size: 30px; font-weight: 750; letter-spacing: -.02em; line-height: 1.15; }
.sg span { font-size: 12px; color: var(--ink-3); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700; padding: 0 7px; line-height: 19px; border-radius: 10px; white-space: nowrap; }
.tag.ai { background: var(--ai-wash); color: var(--ai); border: 1px solid var(--ai-line); }
.tag.ai::before { content: "AI"; font-size: 9px; background: var(--ai); color: #fff; border-radius: 6px; padding: 0 4px; line-height: 13px; }
.tag.calc { background: #f0f2ef; color: var(--ink-2); border: 1px solid var(--line); }
.tag.hyp { background: #fff; color: var(--ai); border: 1px dashed var(--ai); border-radius: 4px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 16px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0; }
.card .sub { font-size: 12.5px; color: var(--ink-2); margin: 2px 0 12px; }

.cal { display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); gap: 5px; }
.cal .wh { font-size: 12px; font-weight: 700; color: var(--ink-2); text-align: center; padding-bottom: 2px; }
.cal .wh.we { color: #b0453a; }
.cal .wk { font-size: 11px; color: var(--ink-3); display: flex; flex-direction: column; justify-content: center; line-height: 1.3; font-variant-numeric: tabular-nums; }
.day { position: relative; height: 84px; border-radius: 10px; border: 0; padding: 7px 8px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.day:focus-visible { outline: 3px solid var(--ai); outline-offset: 2px; }
.day.sel { box-shadow: 0 0 0 3px var(--ink), 0 0 0 5px #fff inset; }
.day .d { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 4px; }
.day .hol { font-size: 10.5px; font-weight: 600; color: #b0453a; background: rgba(255,255,255,.85); border-radius: 4px; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 92px; }
.day .r { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
.day .r small { font-weight: 500; font-size: 11px; opacity: .85; }
.day .mk { position: absolute; top: 6px; right: 6px; display: flex; gap: 3px; }
.day .mk i { width: 16px; height: 16px; border-radius: 4px; background: rgba(255,255,255,.92); color: var(--ink); font: 700 10px/16px var(--sans); text-align: center; font-style: normal; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
.day .mk i.ai { background: var(--ai); color: #fff; box-shadow: none; width: auto; padding: 0 4px; }
.day.na { background: repeating-linear-gradient(135deg, #f1f3f0 0 5px, #e7eae6 5px 10px); color: var(--ink-3); }
.day.surge::after { content: ""; position: absolute; inset: 0; border-radius: 10px; box-shadow: inset 0 0 0 2px #fff, inset 0 0 0 4px var(--ink); pointer-events: none; }

.legend { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin-top: 14px; font-size: 12px; color: var(--ink-2); }
.ramp { display: inline-flex; gap: 2px; vertical-align: middle; }
.ramp span { display: inline-flex; flex-direction: column; align-items: center; font-size: 10.5px; color: var(--ink-3); gap: 2px; }
.ramp i { width: 34px; height: 12px; border-radius: 3px; display: block; }
.lgk { display: inline-flex; align-items: center; gap: 5px; }
.lgk i { width: 16px; height: 16px; border-radius: 4px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.2); font: 700 10px/16px var(--sans); text-align: center; font-style: normal; }
.lgk i.ai { background: var(--ai); color: #fff; box-shadow: none; width: auto; padding: 0 4px; }
.lgk .na { width: 16px; height: 12px; border-radius: 3px; background: repeating-linear-gradient(135deg, #f1f3f0 0 3px, #d9ddd8 3px 6px); }

.trend { margin-top: 16px; }
.chart .ax { font-size: 10.5px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.lg2 { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.lg2 i { display: inline-block; width: 14px; height: 2px; vertical-align: 3px; margin-right: 4px; }
.sm { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 14px; }
.sm h3 { margin: 0; font-size: 12.5px; }
.sm .note { margin: 0 0 2px; }

.panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding: 0; }
.ph { padding: 18px 20px 12px; border-bottom: 1px solid var(--grid); position: sticky; top: 0; background: var(--surface); z-index: 1; }
.ph .dt { font-size: 26px; font-weight: 750; letter-spacing: -.02em; line-height: 1.2; }
.ph .who { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
.ps { padding: 14px 20px; border-bottom: 1px solid var(--grid); }
.ps:last-child { border-bottom: 0; }
.ps h3 { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: var(--ink-2); letter-spacing: .02em; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.nums div { background: #f5f7f4; border-radius: 10px; padding: 8px 10px; }
.nums small { display: block; font-size: 11px; color: var(--ink-3); }
.nums b { font-size: 18px; font-variant-numeric: tabular-nums; }
.sig { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
.sig td { padding: 4px 0; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
.sig td:not(:first-child) { text-align: right; }
.evs { list-style: none; margin: 0; padding: 0; }
.evs li { font-size: 13px; padding: 5px 0; display: flex; gap: 8px; align-items: baseline; }
.evs .k { font-size: 11px; font-weight: 700; border-radius: 4px; padding: 0 5px; background: #f0f2ef; color: var(--ink-2); white-space: nowrap; }
.evs a { text-decoration: none; border-bottom: 1px solid #c8cec9; }
.aib { border: 1px solid var(--ai-line); border-left: 4px solid var(--ai); background: #fbfdfc; border-radius: 4px 12px 12px 4px; padding: 10px 12px; margin-top: 8px; }
.aib p { margin: 6px 0; font-size: 13.5px; line-height: 1.65; }
.aib .hd { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--ink-2); }
.aib ul { list-style: none; margin: 4px 0 0; padding: 0; }
.aib li { font-size: 13px; padding: 5px 0; border-top: 1px dashed #d6e8e2; }
.aib q { color: var(--ink-2); font-style: italic; }
.aib details { margin-top: 6px; font-size: 12.5px; }
.aib summary { cursor: pointer; color: var(--ai); font-weight: 600; }
.aib .reads a { text-decoration: none; border-bottom: 1px solid #c8cec9; }
.rd-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 2px; }
.rd-tabs button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 2px 9px; font-size: 12px; cursor: pointer; }
.rd-tabs button[aria-pressed="true"] { background: var(--ai); border-color: var(--ai); color: #fff; }
.conf { font-weight: 700; color: var(--ai); }
.ba { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.ba div { background: #f5f7f4; border-radius: 10px; padding: 8px 10px; }
.ba small { display: block; font-size: 11px; color: var(--ink-3); }
.ba b { font-size: 16px; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--ink-3); }
.posts { list-style: none; margin: 0; padding: 0; }
.posts li { padding: 5px 0; font-size: 13px; border-top: 1px solid var(--grid); }
.posts li:first-child { border-top: 0; }
.posts a { font-weight: 600; text-decoration: none; border-bottom: 1px solid #c8cec9; }
.posts .m { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.kw { display: flex; flex-wrap: wrap; gap: 6px; }
.kw span { font-size: 12px; background: #f0f2ef; border-radius: 6px; padding: 2px 7px; font-variant-numeric: tabular-nums; }

.foot { margin-top: 18px; font-size: 12px; color: var(--ink-3); line-height: 1.7; }
.foot a { color: var(--ink-2); }
.loading { padding: 60px 32px; color: var(--ink-3); }
.fail { margin: 60px auto; max-width: 560px; padding: 20px 24px; border: 1px solid #d03b3b; border-radius: 12px; background: #fff; }
.fail b { color: #d03b3b; }
.tt { position: fixed; z-index: 50; display: none; pointer-events: none; background: #1b1f1d; color: #f0f2ef; font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 8px; min-width: 150px; max-width: 280px; }
.tt b { display: block; margin-bottom: 2px; }
.tt-row { display: flex; align-items: center; gap: 6px; }
.tt-row i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.tt-row span { margin-left: auto; padding-left: 12px; font-variant-numeric: tabular-nums; }

@media (max-width: 1180px) { .main { grid-template-columns: minmax(0, 1fr); } .panel { position: static; max-height: none; } .hero { grid-template-columns: 1fr; } }
@media (max-width: 720px) {
  .wrap { padding: 0 16px 40px; }
  .hero { padding: 14px 16px; }
  .hero h1 { font-size: 19px; }
  .surges { flex-wrap: wrap; }
  .sg { min-width: 0; flex: 1 1 140px; }
  .card { padding: 14px 12px; }
  .cal { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
  .cal .wk, .cal .wh0 { display: none; }
  .day { height: 54px; padding: 4px 4px; border-radius: 7px; }
  .day .d { font-size: 11px; }
  .day .r { font-size: 10.5px; }
  .day .r small, .day .hol { display: none; }
  .day .mk { top: 3px; right: 3px; }
  .day .mk i { width: 12px; height: 12px; font-size: 8px; line-height: 12px; }
  .day .mk i:not(.ai):nth-child(n+2) { display: none; }
  .sm { grid-template-columns: 1fr; }
  .ps, .ph { padding-left: 14px; padding-right: 14px; }
  .ramp i { width: 24px; }
}
</style>
</head>
<body>
<div id="app"><div class="loading">데이터를 읽는 중…</div></div>
<script>
/* ===== VOC KIT (데이터 읽기 공용 코드) — 각 견본 HTML 안에 그대로 복사해 쓴다 ===== */
const K = (() => {
  const ROOT = "..";               // mockups/ 아래에서 저장소 루트
  const j = p => fetch(`${ROOT}/${p}`, {cache: "no-store"}).then(r => { if (!r.ok) throw new Error(p + " HTTP " + r.status); return r.json(); });
  const opt = p => j(p).catch(() => null);

  async function load() {
    const games = await j("games.json");
    const g = games.games.find(x => x.file) || {id: "lostark", file: "data/lostark.json"};
    const [D, daily, monthly] = await Promise.all([j(g.file), opt(`data/${g.id}-daily.json`), opt(`data/${g.id}-monthly.json`)]);
    return {games, game: g, D, daily, monthly};
  }

  // ---------- 주 · 지역 ----------
  const idx = (D, week) => D.weeks.indexOf(week);
  const latestWeek = D => D.weeks[D.weeks.length - 1];
  // AI 결론(conclusion)이 있는 가장 최근 주. 없으면 마지막 주.
  function aiWeek(D, region) {
    const W = D.weekly[region] || {};
    for (let i = D.weeks.length - 1; i >= 0; i--) { const w = W[D.weeks[i]]; if (w && w.conclusion) return D.weeks[i]; }
    return latestWeek(D);
  }
  const weekly = (D, region, week) => (D.weekly[region] || {})[week] || {conclusion: null, insights: [], items: [], responses: []};
  const summary = (D, region, week) => (D.summary[region] || {})[week] || null;
  const communities = (D, region) => D.communities.filter(c => c.enabled && (!region || c.region === region));
  const comName = (D, id) => (D.communities.find(c => c.id === id) || {}).name || id;
  const boardsOf = (D, comId) => D.boards.filter(b => b.community === comId);

  // ---------- 시리즈 (52주 배열, D.weeks와 같은 순서) ----------
  // scope 예: "community:arca", "region:국내", "board:inven:6271"
  // metric 예: "posts", "neg", "topic:operation", "topic_neg:churn", "group:보석", "signal:이탈 표현", "opinion:complaint"
  // field: value(비중 또는 건수) · base(평시=직전 8주 평균) · ratio(value/base) · diff(neg류: value-base) · count · den · z · n_base
  const ser = (D, scope, metric, field = "value") => (((D.series[scope] || {})[metric] || {})[field]) || D.weeks.map(() => null);
  const at = (D, scope, metric, field, week) => ser(D, scope, metric, field)[idx(D, week)];
  const lastN = (arr, i, n = 13) => arr.slice(Math.max(0, i - n + 1), i + 1);
  const weeksN = (D, week, n = 13) => lastN(D.weeks, idx(D, week), n);

  // 글 수 지수(평시=100) — 게시판별 D.ratio[boardKey][i] * 100, 커뮤니티는 series community:<id> posts ratio
  const postsIndex = (D, scope, week) => { const r = at(D, scope, "posts", "ratio", week); return r == null ? null : Math.round(r * 100); };

  // ---------- 분류 블록(감성 · 주제 · 의견) ----------
  // block 키: "community:arca", "region:국내", "board:inven:6271"
  const block = (D, key, week) => (D.classified_blocks[key] || [])[idx(D, week)] || null;
  // 순감성 지수 = (긍정-부정)/(긍정+부정). 데이터의 net 필드가 같은 값. 주제 '기타'는 제외된 상태.
  const net = b => b ? b.net : null;
  const sentShares = b => { if (!b) return null; const o = b.overall, n = o.pos + o.neg + o.neu + o.unk; return n ? {pos: o.pos / n, neg: o.neg / n, neu: o.neu / n, unk: o.unk / n, n} : null; };
  const topicName = (D, id) => (D.topics.find(t => t.id === id) || {}).name || id;
  const opinionName = (D, id) => (D.opinions.find(t => t.id === id) || {}).name || id;
  // 주제별 부정 비율: topic_senti[t].neg / (neg+neu+pos+unk)
  function topicNeg(b) {
    if (!b || !b.topic_senti) return [];
    return Object.entries(b.topic_senti).map(([t, s]) => { const n = s.neg + s.neu + s.pos + s.unk; return {topic: t, n, neg: n ? s.neg / n : null, pos: n ? s.pos / n : null}; });
  }

  // ---------- 이슈 후보 · AI 판단 · 정독 ----------
  const candidates = (D, region, week) => ((D.candidates[region] || {})[week]) || [];
  const deepread = (D, id) => D.deepread[id] || null;     // {model, read:[{title,url,group:"추천 상위"|"무작위",recommends,comments,date}], result:{summary,subissues:[{name,count,quote,quote_post}],causes:[{event,hypothesis}],confidence:"high|medium|low",endorsed_vs_common}}
  const CONF = {high: "높음", medium: "보통", low: "낮음"};
  const rising = (D, region, week) => ((D.rising[region] || {})[week]) || [];   // [{word,count,base,ratio,new,community,reps:[{title,url,...}]}]
  const reps = (D, region, week) => (((D.representatives[region] || {})[week]) || {});   // {metricId: [{community, posts:[...]}], posts:[...]}

  // ---------- 운영 대응 ----------
  // weekly(...).responses: [{date, kind:"문제 안내|소통|제재|변경 예고", reward, title, url}]
  // 대응 전후 비교: 그 주와 다음 주의 커뮤니티 부정 비율
  function beforeAfterNeg(D, comId, week) {
    const i = idx(D, week), s = ser(D, "community:" + comId, "neg");
    return {before: s[i] ?? null, after: i + 1 < s.length ? s[i + 1] ?? null : null, nextWeek: D.weeks[i + 1] || null};
  }
  const updatesIn = (D, week) => D.updates.filter(u => u.week === week && u.server === "kr");
  const eventsIn = (D, week) => D.other_events.filter(u => u.week === week);

  // ---------- 게임 지표 ----------
  const pcbang = (D, week) => (D.game_metrics.pcbang || []).find(p => p.period_start === week) || null; // {rank, share(%), hours, wow(%), url, source}
  const steam = (D, week) => (D.game_metrics.steam || []).find(p => p.week === week) || null;          // {max, avg, granularity}

  // ---------- 만든 방법 ----------
  const chosenCombo = D => D.method.compare.combos.find(c => c.chosen);  // {name, topic:{accuracy,ci95,n}, sentiment:{...}, opinion:{...}, monthly_total_usd:[lo,hi]}
  const spendTotal = D => Object.values(D.method.spend).reduce((a, b) => a + b, 0);

  // ---------- 표시 형식 ----------
  const num = v => v == null ? "–" : Math.round(v).toLocaleString("ko-KR");
  const pct = (v, d = 1) => v == null ? "–" : (v * 100).toFixed(d) + "%";
  const pp = (v, d = 1) => v == null ? "–" : (v >= 0 ? "+" : "") + (v * 100).toFixed(d) + "%p";
  const times = (v, d = 1) => v == null ? "–" : v.toFixed(d) + "배";
  const signed = (v, d = 2) => v == null ? "–" : (v >= 0 ? "+" : "") + v.toFixed(d);
  const md = w => { const [, m, d] = w.split("-"); return `${+m}/${+d}`; };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

  // ---------- 아주 작은 SVG 그리기 ----------
  // spark(values, {w,h,stroke,fill,base}) → svg 문자열. null은 끊어 그림.
  function spark(vals, o = {}) {
    const w = o.w || 120, h = o.h || 32, p = 2, v = vals.filter(x => x != null);
    if (!v.length) return `<svg width="${w}" height="${h}"></svg>`;
    let lo = Math.min(...v, o.base ?? Infinity), hi = Math.max(...v, o.base ?? -Infinity); if (lo === hi) { lo -= 1; hi += 1; }
    const X = i => p + i * (w - 2 * p) / Math.max(1, vals.length - 1), Y = x => h - p - (x - lo) * (h - 2 * p) / (hi - lo);

function niceTicks(lo, hi, count = 4) {

      if (date === S.date) cls += " sel";
      const glyphs = (memo ? `<i class="ai" title="AI 급증 메모">AI</i>` : "") + M.ev.slice(0, 3).map(e => `<i title="${K.esc(e.kind + ": " + e.title)}">${K.esc(e.g)}</i>`).join("");
      h += `<button class="${cls}" style="${style}" data-date="${date}" aria-label="${K.esc(mdw(date))} ${V.r == null ? txt : V.r.toFixed(2) + "배"}${M.hol ? " " + K.esc(M.hol) : ""}${memo ? " AI 메모 있음" : ""}">
        <span class="d">${first ? +date.slice(5, 7) + "/" : ""}${day}${M.hol ? `<span class="hol">${K.esc(M.hol)}</span>` : ""}</span>
        <span class="mk">${glyphs}</span>
        <span class="r">${txt}</span></button>`;
    }
  }
  return h;
}

function panel() {
  const dates = Y.series.dates, i = dates.indexOf(S.date), date = S.date;
  const P = dayVal(S.com, "posts", i), M = marksOn(date), memo = memoFor(S.com, date);
  const wk = mondayOf(date), inWeeks = D.weeks.includes(wk), W = inWeeks ? K.weekly(D, S.region, wk) : null;
  let h = `<div class="ph"><div class="dt">${K.esc(mdw(date))}</div><div class="who"><span class="dot" style="background:${COM_COLOR[S.com]}"></span>${K.esc(K.comName(D, S.com))}${M.hol ? ` · <b style="color:#b0453a">${K.esc(M.hol)}</b>` : ""}${memo ? ` · <span class="tag ai">급증 메모</span>` : ""}</div></div>`;
  h += `<div class="ps"><h3>그날 숫자 <span class="tag calc">계산값</span></h3>
    <div class="nums"><div><small>글 수</small><b>${P.v == null ? "수집 전" : K.num(P.v)}</b></div><div><small>같은 요일 평균</small><b>${P.b == null ? "산출 전" : K.num(P.b)}</b></div><div><small>배수</small><b>${P.r == null ? "–" : K.times(P.r, 2)}</b></div></div>
    <table class="sig"><tbody>${["버그 신호", "이탈 표현", "복귀 · 신규 표현"].map(k => { const V = dayVal(S.com, k, i); return `<tr><td>${K.esc(k)}</td><td>${V.v == null ? "–" : K.num(V.v) + "건"}</td><td class="note">평균 ${V.b == null ? "–" : V.b.toFixed(1)}</td><td>${V.r == null ? "–" : K.times(V.r, 2)}</td></tr>`; }).join("")}</tbody></table>
    ${P.b != null && P.b < 30 ? `<p class="note">평균 글 수가 적어 배수가 크게 흔들립니다.</p>` : ""}</div>`;
  if (M.ev.length) h += `<div class="ps"><h3>이날 공지 · 업데이트 (공식 원문)</h3><ul class="evs">${M.ev.map(e => `<li><span class="k">${K.esc(e.kind)}</span><a href="${K.esc(e.url)}" target="_blank" rel="noopener">${K.esc(e.title)}</a></li>`).join("")}</ul>${respBA(M, wk)}</div>`;
  if (memo) h += memoView(memo);
  h += `<div class="ps"><h3>그 주의 AI 결론 <span class="tag ai">AI 초안</span></h3>${!inWeeks ? `<p class="note" style="margin:0">${K.esc(wk)} 주는 아직 주간 집계 전입니다(주간 자료는 ${K.esc(D.weeks[D.weeks.length - 1])} 주까지).</p>` : W.conclusion ? `<p style="margin:0 0 4px;font-size:15px;font-weight:600">${K.esc(W.conclusion)}</p><p class="note" style="margin:0">${K.esc(wk)} 주 · ${S.region} · 이슈 후보 ${W.items.length}건 · 판단은 AI 초안(담당자 확인 전)</p>${W.items.filter(it => it.community_id === S.com).map(it => `<p style="margin:6px 0 0;font-size:13px">· ${K.esc(it.issue)} <b>${K.esc(it.change)}</b> — ${K.esc(it.draft.insight)} <span class="note">(AI 초안 ${K.esc(it.judgment.level)})</span></p>`).join("")}` : `<p class="note" style="margin:0">${K.esc(wk)} 주: 이슈 후보 없음(AI 결론 없음).</p>`}</div>`;
  const today = (Y.communities || []).find(c => c.community_id === S.com);
  if (date === Y.date && today) {
    h += `<div class="ps"><h3>이날 급상승 키워드 <span class="tag calc">계산값</span></h3><div class="kw">${(today.rising || []).map(r => `<span>${K.esc(r.word)} ${K.num(r.count)}건 · ${K.times(r.ratio)}</span>`).join("") || `<span class="note">없음</span>`}</div>
      <h3 style="margin-top:12px">이날 많이 본 글 (원문)</h3><ul class="posts">${(today.top || []).map(p => `<li><a href="${K.esc(p.url)}" target="_blank" rel="noopener">${K.esc(p.title)}</a><div class="m">조회 ${K.num(p.views)} · 댓글 ${K.num(p.comments)}</div></li>`).join("")}</ul></div>`;
  }
  return h;
}

function respBA(M, wk) {
  if (!M.ev.some(e => e.resp) || !D.weeks.includes(wk)) return "";
  const ba = K.beforeAfterNeg(D, S.com, wk);
  return `<div class="ba"><div><small>${K.esc(COM_SHORT[S.com])} 부정 비율 · ${K.esc(wk)} 주</small><b>${K.pct(ba.before)}</b></div><div><small>다음 주</small><b>${ba.after == null ? "다음 주 데이터 없음" : K.pct(ba.after)}</b></div></div><p class="note">대응 전후 비교는 주간 부정 비율을 나란히 놓은 것이며 공지의 효과(인과)를 뜻하지 않습니다.</p>`;
}

function memoView(c) {
  const reads = c.reads.filter(r => r.status === "ok" && r.result);
  if (!reads.length) return "";
  const k = Math.min(S.read, reads.length - 1), r = reads[k], R = r.result;
  const cost = reads.reduce((a, x) => a + (+x.cost_usd || 0), 0);
  return `<div class="ps"><h3>AI 급증 메모 <span class="tag ai">AI 정독 요약(Opus 5.5 · 묶음마다 6건 정독)</span></h3>
    <div class="note">${K.esc(c.community)} 정독 ${reads.length}묶음 · 비용 $${cost.toFixed(4)} · 무엇이 이야기되는지까지만 쓰고, 대응 여부는 사람이 판단</div>
    <div class="rd-tabs" role="tablist">${reads.map((x, j) => `<button data-read="${j}" aria-pressed="${j === k}">${K.esc(x.label)} · ${K.num(x.count)}건</button>`).join("")}</div>
    <div class="aib">
      <div class="hd"><span>정독 신뢰도 <span class="conf">${K.esc(K.CONF[R.confidence] || "–")}</span></span><span>· 추천 상위 ${r.read.filter(x => x.group === "추천 상위").length} · 무작위 ${r.read.filter(x => x.group === "무작위").length}</span><span>· 이 묶음 $${(+r.cost_usd).toFixed(4)}</span></div>
      <p>${K.esc(R.summary)}</p>
      <ul>${(R.subissues || []).map(s => `<li>${K.esc(s.name)} <span class="note">${s.count}/${r.read.length}건</span><br><q>${K.esc(s.quote)}</q> <a class="note" href="${K.esc((r.read[s.quote_post - 1] || {}).url || "#")}" target="_blank" rel="noopener">글 ${s.quote_post} ↗</a></li>`).join("")}
      ${(R.causes || []).map(cz => `<li><span class="tag hyp">가설</span> ${K.esc(cz.hypothesis)}${cz.event && cz.event !== "없음" ? ` <span class="note">· 관련 공지: ${K.esc(cz.event)}</span>` : ` <span class="note">· 연결된 공지 없음</span>`}</li>`).join("")}</ul>
      <details><summary>정독한 글 ${r.read.length}건 (원문)</summary><ul class="posts reads">${r.read.map(p => `<li><a href="${K.esc(p.url)}" target="_blank" rel="noopener">${K.esc(p.title)}</a><div class="m">글 ${p.n} · ${K.esc(p.group)} · 추천 ${K.num(p.recommends)} · 댓글 ${K.num(p.comments)}${p.body === "비어 있음" ? " · 본문 비어 있음(이미지 등)" : ""}</div></li>`).join("")}</ul></details>
    </div></div>`;
}

function drawCharts() {
  const dates = Y.series.dates, sel = dates.indexOf(S.date), lab = dates.map(d => `${+d.slice(5, 7)}/${+d.slice(8)}`);
  const tip = k => mdw(dates[k]);
  const P = seriesOf(S.com, "posts");
  mountLine(document.getElementById("lcPosts"), {labels: lab, tipLabel: tip, h: 200, mark: sel, min0: true,
    series: [{name: "그날 글 수", color: COM_COLOR[S.com], values: P.value}, {name: "같은 요일 평균", color: "#8b928e", values: P.base, dash: "4 3", thin: true}],
    fmt: v => K.num(v) + "건", fmtTick: v => v >= 10000 ? (v / 1000) + "K" : K.num(v), aria: "일별 글 수"});
  ["버그 신호", "이탈 표현", "복귀 · 신규 표현"].forEach((k, j) => {
    const s = seriesOf(S.com, k);
    mountLine(document.getElementById("lcSig" + j), {labels: lab, tipLabel: tip, h: 110, mark: sel, min0: true, ml: 30, xEvery: 21,
      series: [{name: k, color: COM_COLOR[S.com], values: s.value}, {name: "같은 요일 평균", color: "#8b928e", values: s.base, dash: "3 3", thin: true}],
      fmt: v => (Math.round(v * 10) / 10) + "건", fmtTick: v => v, aria: k + " 추이"});
  });
}

document.addEventListener("click", ev => {
  let e;
  if ((e = ev.target.closest("[data-region]"))) { S.region = e.dataset.region; S.com = K.communities(D, S.region)[S.region === "국내" ? 1 : 0].id; S.read = 0; render(); }
  else if ((e = ev.target.closest("[data-com]"))) { S.com = e.dataset.com; S.read = 0; render(); }
  else if ((e = ev.target.closest("[data-metric]"))) { S.metric = e.dataset.metric; render(); }
  else if ((e = ev.target.closest("[data-read]"))) { S.read = +e.dataset.read; render(); }
  else if ((e = ev.target.closest("[data-jump]"))) { const [c, d] = e.dataset.jump.split("|"); S.com = c; S.date = d; S.read = 0; render(); }
  else if ((e = ev.target.closest("[data-date]"))) { S.date = e.dataset.date; S.read = 0; render(); if (innerWidth <= 1180) document.querySelector(".panel").scrollIntoView({behavior: "smooth"}); }
});

K.load().then(res => {
  D = res.D; Y = res.daily;
  if (!Y || !Y.series) throw new Error("data/lostark-daily.json 없음");
  S.date = Y.series.dates[Y.series.dates.length - 1];
  render(); document.body.dataset.ready = "1";
}).catch(fail);
</script>
</body>
</html>
